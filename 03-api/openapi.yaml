  schemas:
    # ---------- Comunes ----------
    Problema:
      type: object
      additionalProperties: false
      description: Error en formato Problem Details (RFC 9457) con las extensiones de Hindama. Ver convenciones, sección 8.
      required: [type, title, status, detail, codigo, id_peticion, errores]
      properties:
        type:
          type: string
          description: '`urn:hindama:error:<codigo>`.'
          examples: ['urn:hindama:error:url.destino_no_permitido']
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Texto en español de respaldo. El frontend debe preferir su propio texto según `codigo`.
        codigo:
          type: string
          description: Código estable del error. Es el valor que el cliente debe interpretar.
          examples: ['url.destino_no_permitido']
        id_peticion:
          type: string
          description: Mismo valor que la cabecera `X-Request-Id`.
        errores:
          type: array
          description: Errores por campo. Vacío si el error no es de un campo.
          items:
            $ref: '#/components/schemas/ErrorCampo'
    ErrorCampo:
      type: object
      additionalProperties: false
      required: [campo, codigo, mensaje]
      properties:
        campo:
          type: [string, 'null']
          description: Ruta del campo con puntos, nombre del parámetro o ubicación en un documento importado.
        codigo:
          type: string
        mensaje:
          type: string
    ProblemaVerificacion:
      type: object
      additionalProperties: false
      description: '`Problema` con el campo `encontrado`.'
      required: [type, title, status, detail, codigo, id_peticion, errores, encontrado]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        codigo:
          type: string
          enum:
            - verificacion.archivo_no_encontrado
            - verificacion.contenido_distinto
            - verificacion.txt_ausente
            - verificacion.error_conexion
            - verificacion.destino_no_permitido
        id_peticion:
          type: string
        errores:
          type: array
          items:
            $ref: '#/components/schemas/ErrorCampo'
        encontrado:
          type: [string, 'null']
          maxLength: 200
          description: |
            Resumen de lo obtenido, como texto no confiable: código HTTP, inicio del contenido del
            archivo o registros TXT encontrados. Mostrar siempre escapado.
    Advertencia:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, ubicacion]
      properties:
        codigo:
          type: string
          examples: ['url.sin_tls']
        mensaje:
          type: string
          description: Texto en español de respaldo.
        ubicacion:
          type: [string, 'null']
          description: En avisos del contrato, JSON Pointer dentro del documento; si no, `null`.
    Salud:
      type: object
      additionalProperties: false
      required: [estado]
      properties:
        estado:
          type: string
          enum: [ok]

    # ---------- Catálogos ----------
    Rol:
      type: string
      enum: [analista, administrador]
    EstadoVerificacion:
      type: string
      enum: [pendiente, verificado]
    MetodoVerificacion:
      type: string
      enum: [archivo, dns]
    MetodoHttp:
      type: string
      enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, TRACE]
    Modulo:
      type: string
      description: Los siete módulos de prueba (F-09).
      enum: [autenticacion, configuracion, acceso_objetos, acceso_funciones, propiedades, consumo_recursos, inyeccion_sql]
    EstadoEjecucion:
      type: string
      enum: [en_cola, en_curso, completada, cancelada, fallida]

    # ---------- Cuenta ----------
    Yo:
      type: object
      additionalProperties: false
      required: [id, nombre, correo, rol, terminos]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          description: Nombre registrado en Cognito; no se guarda en la base de datos.
        correo:
          type: string
          format: email
          description: Correo registrado en Cognito; no se guarda en la base de datos.
        rol:
          $ref: '#/components/schemas/Rol'
        terminos:
          $ref: '#/components/schemas/EstadoTerminos'
    EstadoTerminos:
      type: object
      additionalProperties: false
      required: [version_vigente, version_aceptada, aceptados_en, requiere_aceptar]
      properties:
        version_vigente:
          type: string
          description: Versión de los términos que hay que aceptar. El texto lo publica el frontend.
          examples: ['2026-10-30']
        version_aceptada:
          type: [string, 'null']
        aceptados_en:
          type: [string, 'null']
          format: date-time
        requiere_aceptar:
          type: boolean
          description: '`true` si el usuario no ha aceptado la versión vigente; en ese caso no puede crear proyectos.'
    AceptacionTerminos:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          type: string
          description: Debe ser igual a `version_vigente`.

    # ---------- Proyectos ----------
    ProyectoCrear:
      type: object
      required: [nombre, url_base]
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
          description: Se recortan los espacios de los extremos.
        descripcion:
          type: [string, 'null']
          maxLength: 500
        url_base:
          type: string
          format: uri
          maxLength: 2048
          description: |
            URL base de la API, con esquema `http` o `https`, sin usuario, contraseña ni fragmento. Puede
            incluir puerto y ruta (`https://api.ejemplo.com/v1`). Se rechaza si el host es, o resuelve a, una
            dirección privada, de loopback, de enlace local o de metadatos (RF-11).
          examples: ['https://api.ejemplo.com/v1']
    ProyectoEditar:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 100
        descripcion:
          type: [string, 'null']
          maxLength: 500
        url_base:
          type: string
          format: uri
          maxLength: 2048
    ProyectoResumen:
      type: object
      additionalProperties: false
      description: Fila de la lista de proyectos (RF-12).
      required: [id, nombre, url_base, estado_verificacion, concluido, ultima_ejecucion_en, hallazgos_abiertos, creado_en]
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        url_base:
          type: string
        estado_verificacion:
          $ref: '#/components/schemas/EstadoVerificacion'
        concluido:
          type: boolean
          description: Al menos una ejecución completada y ningún hallazgo abierto (RN-10). Es independiente de la verificación.
        ultima_ejecucion_en:
          type: [string, 'null']
          format: date-time
        hallazgos_abiertos:
          type: integer
          minimum: 0
        creado_en:
          type: string
          format: date-time
    Proyecto:
      type: object
      additionalProperties: false
      description: Dashboard del proyecto (RF-15).
      required:
        - id
        - nombre
        - descripcion
        - url_base
        - host
        - estado_verificacion
        - verificado_en
        - concluido
        - contrato_vigente
        - ultima_ejecucion
        - hallazgos_abiertos_por_severidad
        - modulos
        - advertencias
        - creado_en
        - actualizado_en
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        descripcion:
          type: [string, 'null']
        url_base:
          type: string
        host:
          type: string
          description: Host exacto que se verifica (sin puerto ni ruta).
        estado_verificacion:
          $ref: '#/components/schemas/EstadoVerificacion'
        verificado_en:
          type: [string, 'null']
          format: date-time
        concluido:
          type: boolean
        contrato_vigente:
          oneOf:
            - $ref: '#/components/schemas/VersionContratoResumen'
            - type: 'null'
        ultima_ejecucion:
          oneOf:
            - $ref: '#/components/schemas/EjecucionResumen'
            - type: 'null'
        hallazgos_abiertos_por_severidad:
          $ref: '#/components/schemas/ConteoSeveridad'
        modulos:
          type: array
          description: Los siete módulos con su disponibilidad (RF-45). Siempre en el orden del catálogo.
          items:
            $ref: '#/components/schemas/DisponibilidadModulo'
        advertencias:
          type: array
          description: |
            Persistentes: aparecen en toda respuesta mientras la condición siga (`url.sin_tls`).
            Momentáneas: solo en la respuesta de la operación que las causó (`proyecto.verificacion_perdida`
            en `editarProyecto`, `url.no_resuelve` en `crearProyecto` y `editarProyecto`).
          items:
            $ref: '#/components/schemas/Advertencia'
        creado_en:
          type: string
          format: date-time
        actualizado_en:
          type: string
          format: date-time
    ConteoSeveridad:
      type: object
      additionalProperties: false
      description: Hallazgos abiertos (nuevo, persistente o regresión) por severidad.
      required: [critica, alta, media, baja, informativa, total]
      properties:
        critica:
          type: integer
          minimum: 0
        alta:
          type: integer
          minimum: 0
        media:
          type: integer
          minimum: 0
        baja:
          type: integer
          minimum: 0
        informativa:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    DisponibilidadModulo:
      type: object
      additionalProperties: false
      required: [modulo, riesgo, disponible, faltantes]
      properties:
        modulo:
          $ref: '#/components/schemas/Modulo'
        riesgo:
          type: string
          enum: [bajo, medio, alto]
          description: Los de riesgo medio y alto exigen confirmación en cada ejecución (RN-05).
        disponible:
          type: boolean
        faltantes:
          type: array
          description: |
            Requisitos que faltan (RF-45); vacío si `disponible` es `true`. Valores:
            `proyecto_no_verificado`, `sin_contrato`, `identidades_insuficientes`,
            `sin_identidad_administradora`, `sin_recursos`, `politica_sin_confirmar`.
          items:
            type: string
            enum:
              - proyecto_no_verificado
              - sin_contrato
              - identidades_insuficientes
              - sin_identidad_administradora
              - sin_recursos
              - politica_sin_confirmar
    EjecucionResumen:
      type: object
      additionalProperties: false
      description: Resumen de una ejecución. El recurso completo se define en la semana 2.
      required: [id, numero, estado, creada_en, terminada_en]
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: integer
          minimum: 1
        estado:
          $ref: '#/components/schemas/EstadoEjecucion'
        creada_en:
          type: string
          format: date-time
        terminada_en:
          type: [string, 'null']
          format: date-time
    PaginaProyectos:
      type: object
      additionalProperties: false
      required: [elementos, total, pagina, tamano]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/ProyectoResumen'
        total:
          type: integer
          minimum: 0
        pagina:
          type: integer
          minimum: 1
        tamano:
          type: integer
          minimum: 1

    # ---------- Verificación ----------
    VerificacionSolicitud:
      type: object
      required: [metodo]
      additionalProperties: false
      properties:
        metodo:
          $ref: '#/components/schemas/MetodoVerificacion'
    Verificacion:
      type: object
      additionalProperties: false
      required: [estado, host, codigo, metodo, verificado_en, archivo, dns]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoVerificacion'
        host:
          type: string
        codigo:
          type: string
          description: Código del proyecto que hay que publicar (RF-17).
        metodo:
          description: Método con el que se verificó; `null` si está pendiente.
          oneOf:
            - $ref: '#/components/schemas/MetodoVerificacion'
            - type: 'null'
        verificado_en:
          type: [string, 'null']
          format: date-time
        archivo:
          type: object
          additionalProperties: false
          description: Instrucciones del método por archivo.
          required: [url, contenido]
          properties:
            url:
              type: string
              examples: ['https://api.ejemplo.com/.well-known/hindama-verificacion.txt']
            contenido:
              type: string
              description: Contenido exacto del archivo (el código).
        dns:
          type: object
          additionalProperties: false
          description: Instrucciones del método por registro TXT.
          required: [nombre, tipo, valor]
          properties:
            nombre:
              type: string
              examples: ['_hindama-verificacion.api.ejemplo.com']
            tipo:
              type: string
              enum: [TXT]
            valor:
              type: string

    # ---------- Contratos ----------
    ContratoImportar:
      type: object
      additionalProperties: false
      description: Exactamente uno de `archivo` o `url`.
      properties:
        archivo:
          type: string
          format: binary
          description: Documento OpenAPI 3.0 o 3.1 en JSON o YAML, hasta 5 MB.
        url:
          type: string
          format: uri
          maxLength: 2048
          description: URL pública del documento. Puede estar en un host distinto al de la API.
    VersionContratoResumen:
      type: object
      additionalProperties: false
      required: [id, numero, origen, version_openapi, total_operaciones, importado_en]
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: integer
          minimum: 1
        origen:
          type: string
          enum: [archivo, url]
        version_openapi:
          type: string
          examples: ['3.1.0']
        total_operaciones:
          type: integer
          minimum: 0
        importado_en:
          type: string
          format: date-time
    VersionContrato:
      type: object
      additionalProperties: false
      required: [id, numero, origen, version_openapi, total_operaciones, importado_en, url_origen, nombre_archivo, formato, titulo_api, sha256, vigente, advertencias, diferencias]
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: integer
          minimum: 1
        origen:
          type: string
          enum: [archivo, url]
        version_openapi:
          type: string
        total_operaciones:
          type: integer
          minimum: 0
        importado_en:
          type: string
          format: date-time
        url_origen:
          type: [string, 'null']
        nombre_archivo:
          type: [string, 'null']
        formato:
          type: string
          enum: [json, yaml]
        titulo_api:
          type: [string, 'null']
          description: '`info.title` del documento. Texto no confiable.'
        sha256:
          type: string
        vigente:
          type: boolean
          description: '`true` si es la versión más reciente.'
        advertencias:
          type: array
          description: Lo que no se pudo interpretar, referencias externas no seguidas y servidores distintos a la URL base (RF-23, RF-27).
          items:
            $ref: '#/components/schemas/Advertencia'
        diferencias:
          description: Cambios respecto a la versión anterior (RF-26); `null` en la primera versión.
          oneOf:
            - $ref: '#/components/schemas/DiferenciasContrato'
            - type: 'null'
    DiferenciasContrato:
      type: object
      additionalProperties: false
      required: [version_anterior, agregadas, modificadas, eliminadas]
      properties:
        version_anterior:
          type: integer
          description: '`numero` de la versión con la que se compara.'
        agregadas:
          type: array
          items:
            $ref: '#/components/schemas/OperacionReferencia'
        modificadas:
          type: array
          items:
            $ref: '#/components/schemas/OperacionReferencia'
        eliminadas:
          type: array
          items:
            $ref: '#/components/schemas/OperacionReferencia'
    OperacionReferencia:
      type: object
      additionalProperties: false
      required: [id, metodo, ruta]
      properties:
        id:
          type: string
          format: uuid
        metodo:
          $ref: '#/components/schemas/MetodoHttp'
        ruta:
          type: string
    PaginaContratos:
      type: object
      additionalProperties: false
      required: [elementos, total, pagina, tamano]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/VersionContratoResumen'
        total:
          type: integer
          minimum: 0
        pagina:
          type: integer
          minimum: 1
        tamano:
          type: integer
          minimum: 1

    # ---------- Operaciones ----------
    Operacion:
      type: object
      additionalProperties: false
      description: Operación del proyecto, estable entre versiones del contrato. Los textos vienen del contrato y no son confiables.
      required: [id, metodo, ruta, operation_id, resumen, etiquetas, parametros, cuerpo, seguridad, retirada_en]
      properties:
        id:
          type: string
          format: uuid
        metodo:
          $ref: '#/components/schemas/MetodoHttp'
        ruta:
          type: string
          description: Ruta tal como aparece en la versión vigente (o en la última que la incluyó, si fue retirada).
          examples: ['/users/{userId}/orders']
        operation_id:
          type: [string, 'null']
        resumen:
          type: [string, 'null']
          description: '`summary` de la operación.'
        etiquetas:
          type: array
          items:
            type: string
        parametros:
          type: array
          items:
            $ref: '#/components/schemas/Parametro'
        cuerpo:
          description: Cuerpo de la petición; `null` si no tiene.
          oneOf:
            - $ref: '#/components/schemas/CuerpoPeticion'
            - type: 'null'
        seguridad:
          type: array
          description: Esquemas de seguridad declarados; vacío si la operación es pública según el contrato.
          items:
            $ref: '#/components/schemas/SeguridadDeclarada'
        retirada_en:
          type: [string, 'null']
          format: date-time
          description: Fecha en que dejó de aparecer en el contrato; `null` si está vigente.
    Parametro:
      type: object
      additionalProperties: false
      required: [nombre, ubicacion, requerido, tipo]
      properties:
        nombre:
          type: string
        ubicacion:
          type: string
          enum: [path, query, header, cookie]
        requerido:
          type: boolean
        tipo:
          type: [string, 'null']
          description: Tipo del esquema (`string`, `integer`…), o `null` si no se declaró.
    CuerpoPeticion:
      type: object
      additionalProperties: false
      required: [requerido, tipos_contenido]
      properties:
        requerido:
          type: boolean
        tipos_contenido:
          type: array
          items:
            type: string
          examples: [['application/json']]
    SeguridadDeclarada:
      type: object
      additionalProperties: false
      required: [esquema, tipo]
      properties:
        esquema:
          type: string
          description: Nombre del esquema en `components.securitySchemes`.
        tipo:
          type: string
          enum: [http_bearer, http_basic, api_key, oauth2, openid_connect, otro]
    PaginaOperaciones:
      type: object
      additionalProperties: false
      required: [elementos, total, pagina, tamano]
      properties:
        elementos:
          type: array
          items:
            $ref: '#/components/schemas/Operacion'
        total:
          type: integer
          minimum: 0
        pagina:
          type: integer
          minimum: 1
        tamano:
          type: integer
          minimum: 1