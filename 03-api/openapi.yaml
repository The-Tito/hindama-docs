            project_id: 0192e3a0-2222-7000-8000-000000000001
            source_ip: 203.0.113.25
            details:
              run_id: 0192e3a0-7777-7000-8000-000000000003
              modules: [object_access, configuration]
              limits:
                requests_per_second: 5
                concurrency: 2
                max_requests: 5000
                max_duration_minutes: 30
        total: 2
        page: 1
        page_size: 20

  schemas:
    # ---------- Common ----------
    Problem:
      type: object
      additionalProperties: false
      description: Error en formato Problem Details (RFC 9457) con las extensiones de Hindama. Ver convenciones, sección 8.
      required: [type, title, status, detail, code, request_id, errors]
      properties:
        type:
          type: string
          description: '`urn:hindama:error:<code>`.'
          examples: ['urn:hindama:error:url.destination_not_allowed']
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Texto en español de respaldo. El frontend debe preferir su propio texto según `code`.
        code:
          type: string
          description: Código estable del error. Es el valor que el cliente debe interpretar.
          examples: ['url.destination_not_allowed']
        request_id:
          type: string
          description: Mismo valor que la cabecera `X-Request-Id`.
        errors:
          type: array
          description: Errores por campo. Vacío si el error no es de un campo.
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: [string, 'null']
          description: Ruta del campo con puntos, nombre del parámetro o ubicación en un documento importado.
        code:
          type: string
        message:
          type: string
    VerificationProblem:
      type: object
      additionalProperties: false
      description: '`Problem` con el campo `found`.'
      required: [type, title, status, detail, code, request_id, errors, found]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum:
            - verification.file_not_found
            - verification.content_mismatch
            - verification.txt_missing
            - verification.connection_error
            - verification.destination_not_allowed
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        found:
          type: [string, 'null']
          maxLength: 200
          description: |
            Resumen de lo obtenido, como texto no confiable: código HTTP, inicio del contenido del
            archivo o registros TXT encontrados. Mostrar siempre escapado.
    Warning:
      type: object
      additionalProperties: false
      required: [code, message, location]
      properties:
        code:
          type: string
          examples: ['url.no_tls']
        message:
          type: string
          description: Texto en español de respaldo.
        location:
          type: [string, 'null']
          description: En avisos del contrato, JSON Pointer dentro del documento; si no, `null`.
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    # ---------- Catalogs ----------
    Role:
      type: string
      enum: [analyst, admin]
    VerificationStatus:
      type: string
      enum: [pending, verified]
    VerificationMethod:
      type: string
      enum: [file, dns]
    HttpMethod:
      type: string
      enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, TRACE]
    Module:
      type: string
      description: Los siete módulos de prueba (F-09).
      enum: [authentication, configuration, object_access, function_access, property_access, resource_consumption, sql_injection]
    RunStatus:
      type: string
      description: '`queued` y `running` son activos; los demás, finales (modelo de datos, sección 4.2).'
      enum: [queued, running, completed, cancelled, failed]
    EndReason:
      type: string
      description: |
        Por qué terminó una ejecución. `completed`: `normal` o `limit_reached` (RF-47). `cancelled`:
        `cancelled_by_user` (RF-52) o `verification_invalid` (RF-20). `failed`: `heartbeat_expired`,
        `lost_in_queue` (CU-23) o `error`.
      enum: [normal, limit_reached, cancelled_by_user, verification_invalid, heartbeat_expired, lost_in_queue, error]
    Verdict:
      type: string
      description: |
        Veredicto de una celda. Solo `pass` y `fail` cuentan como evaluada. `skipped`: credencial vencida
        (RF-33) o requisito faltante. `error`: no se pudo evaluar (sin respuesta, destino bloqueado).
      enum: [pass, fail, skipped, error]

    # ---------- Account ----------
    Me:
      type: object
      additionalProperties: false
      required: [id, name, email, role, terms]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nombre registrado en Cognito; no se guarda en la base de datos.
        email:
          type: string
          format: email
          description: Correo registrado en Cognito; no se guarda en la base de datos.
        role:
          $ref: '#/components/schemas/Role'
        terms:
          $ref: '#/components/schemas/TermsStatus'
    TermsStatus:
      type: object
      additionalProperties: false
      required: [current_version, accepted_version, accepted_at, acceptance_required]
      properties:
        current_version:
          type: string
          description: Versión de los términos que hay que aceptar. El texto lo publica el frontend.
          examples: ['2026-10-30']
        accepted_version:
          type: [string, 'null']
        accepted_at:
          type: [string, 'null']
          format: date-time
        acceptance_required:
          type: boolean
          description: '`true` si el usuario no ha aceptado la versión vigente; en ese caso no puede crear proyectos.'
    TermsAcceptance:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          type: string
          maxLength: 50
          pattern: '^[^\x00-\x1F\x7F]*$'
          description: Debe ser igual a `current_version`.

    # ---------- Projects ----------
    ProjectCreate:
      type: object
      required: [name, base_url]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[^\x00-\x1F\x7F]*$'
          description: Se recortan los espacios de los extremos. Sin caracteres de control.
        description:
          type: [string, 'null']
          maxLength: 500
          pattern: '^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$'
          description: Admite tabulador y saltos de línea; ningún otro carácter de control.
        base_url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            URL base de la API, con esquema `http` o `https`, sin usuario, contraseña ni fragmento. Puede
            incluir puerto y ruta (`https://api.ejemplo.com/v1`). Se rechaza si el host es, o resuelve a, una
            dirección privada, de loopback, de enlace local o de metadatos (RF-11).
          examples: ['https://api.ejemplo.com/v1']
    ProjectUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[^\x00-\x1F\x7F]*$'
        description:
          type: [string, 'null']
          maxLength: 500
          pattern: '^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$'
          description: Admite tabulador y saltos de línea; ningún otro carácter de control.
        base_url:
          type: string
          format: uri
          maxLength: 2048
    ProjectSummary:
      type: object
      additionalProperties: false
      description: Fila de la lista de proyectos (RF-12).
      required: [id, name, base_url, verification_status, concluded, last_run_at, open_findings, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        base_url:
          type: string
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
        concluded:
          type: boolean
          description: Al menos una ejecución completada y ningún hallazgo abierto (RN-10). Es independiente de la verificación.
        last_run_at:
          type: [string, 'null']
          format: date-time
        open_findings:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
    Project:
      type: object
      additionalProperties: false
      description: Dashboard del proyecto (RF-15).
      required:
        - id
        - name
        - description
        - base_url
        - host
        - verification_status
        - verified_at
        - concluded
        - current_contract
        - last_run
        - open_findings_by_severity
        - modules
        - warnings
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        base_url:
          type: string
        host:
          type: string
          description: Host exacto que se verifica (sin puerto ni ruta).
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
        verified_at:
          type: [string, 'null']
          format: date-time
        concluded:
          type: boolean
        current_contract:
          oneOf:
            - $ref: '#/components/schemas/ContractVersionSummary'
            - type: 'null'
        last_run:
          oneOf:
            - $ref: '#/components/schemas/RunSummary'
            - type: 'null'
        open_findings_by_severity:
          $ref: '#/components/schemas/SeverityCount'
          description: Hallazgos abiertos (`new`, `persistent` o `regression`).
        modules:
          type: array
          description: Los siete módulos con su disponibilidad (RF-45). Siempre en el orden del catálogo.
          items:
            $ref: '#/components/schemas/ModuleAvailability'
        warnings:
          type: array
          description: |
            Persistentes: aparecen en toda respuesta mientras la condición siga (`url.no_tls`).
            Momentáneas: solo en la respuesta de la operación que las causó (`project.verification_lost`
            en `updateProject`, `url.unresolved` en `createProject` y `updateProject`).
          items:
            $ref: '#/components/schemas/Warning'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SeverityCount:
      type: object
      additionalProperties: false
      description: Hallazgos por severidad. Qué hallazgos cuenta lo indica el campo que lo usa.
      required: [critical, high, medium, low, info, total]
      properties:
        critical:
          type: integer
          minimum: 0
        high:
          type: integer
          minimum: 0
        medium:
          type: integer
          minimum: 0
        low:
          type: integer
          minimum: 0
        info:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    ModuleAvailability:
      type: object
      additionalProperties: false
      required: [module, risk, available, missing]
      properties:
        module:
          $ref: '#/components/schemas/Module'
        risk:
          type: string
          enum: [low, medium, high]
          description: Los de riesgo medio y alto exigen confirmación en cada ejecución (RN-05).
        available:
          type: boolean
        missing:
          type: array
          description: Requisitos que faltan (RF-45); vacío si `available` es `true`.
          items:
            type: string
            enum:
              - project_not_verified
              - no_contract
              - insufficient_identities
              - no_admin_identity
              - no_resources
              - policy_unconfirmed
    RunSummary:
      type: object
      additionalProperties: false
      description: |
        Resumen de una ejecución (RF-63): elemento de `listRuns` y `last_run` del dashboard. La duración
        es `finished_at` menos `started_at`.
      required: [id, number, status, end_reason, modules, requests_sent, findings_by_severity, created_at, started_at, finished_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
          description: Consecutivo por proyecto.
        status:
          $ref: '#/components/schemas/RunStatus'
        end_reason:
          description: '`null` mientras la ejecución está activa.'
          oneOf:
            - $ref: '#/components/schemas/EndReason'
            - type: 'null'
        modules:
          type: array
          description: Módulos de la ejecución, en el orden del catálogo.
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Module'
        requests_sent:
          type: integer
          minimum: 0
        findings_by_severity:
          $ref: '#/components/schemas/SeverityCount'
          description: Fallas detectadas en esta ejecución.
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
          description: Cuando el motor la tomó; `null` en cola.
        finished_at:
          type: [string, 'null']
          format: date-time
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1

    # ---------- Verification ----------
    VerificationRequest:
      type: object
      required: [method]
      additionalProperties: false
      properties:
        method:
          $ref: '#/components/schemas/VerificationMethod'
    Verification:
      type: object
      additionalProperties: false
      required: [status, host, code, method, verified_at, file, dns]
      properties:
        status:
          $ref: '#/components/schemas/VerificationStatus'
        host:
          type: string
        code:
          type: string
          description: Código del proyecto que hay que publicar (RF-17).
        method:
          description: Método con el que se verificó; `null` si está pendiente.
          oneOf:
            - $ref: '#/components/schemas/VerificationMethod'
            - type: 'null'
        verified_at:
          type: [string, 'null']
          format: date-time
        file:
          type: object
          additionalProperties: false
          description: Instrucciones del método por archivo.
          required: [url, content]
          properties:
            url:
              type: string
              examples: ['https://api.ejemplo.com/.well-known/hindama-verificacion.txt']
            content:
              type: string
              description: Contenido exacto del archivo (el código).
        dns:
          type: object
          additionalProperties: false
          description: Instrucciones del método por registro TXT.
          required: [name, type, value]
          properties:
            name:
              type: string
              examples: ['_hindama-verificacion.api.ejemplo.com']
            type:
              type: string
              enum: [TXT]
            value:
              type: string

    # ---------- Contracts ----------
    ContractImport:
      type: object
      additionalProperties: false
      description: Exactamente uno de `file` o `url`.
      properties:
        file:
          type: string
          format: binary
          description: Documento OpenAPI 3.0 o 3.1 en JSON o YAML, hasta 5 MB.
        url:
          type: string
          format: uri
          maxLength: 2048
          description: URL pública del documento. Puede estar en un host distinto al de la API.
    ContractVersionSummary:
      type: object
      additionalProperties: false
      required: [id, number, source, openapi_version, operation_count, imported_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        source:
          type: string
          enum: [file, url]
        openapi_version:
          type: string
          examples: ['3.1.0']
        operation_count:
          type: integer
          minimum: 0
        imported_at:
          type: string
          format: date-time
    ContractVersion:
      type: object
      additionalProperties: false
      required: [id, number, source, openapi_version, operation_count, imported_at, source_url, file_name, format, api_title, sha256, is_current, warnings, changes]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        source:
          type: string
          enum: [file, url]
        openapi_version:
          type: string
        operation_count:
          type: integer
          minimum: 0
        imported_at:
          type: string
          format: date-time
        source_url:
          type: [string, 'null']
        file_name:
          type: [string, 'null']
        format:
          type: string
          enum: [json, yaml]
        api_title:
          type: [string, 'null']
          description: '`info.title` del documento. Texto no confiable.'
        sha256:
          type: string
        is_current:
          type: boolean
          description: '`true` si es la versión más reciente.'
        warnings:
          type: array
          description: Lo que no se pudo interpretar, referencias externas no seguidas y servidores distintos a la URL base (RF-23, RF-27).
          items:
            $ref: '#/components/schemas/Warning'
        changes:
          description: Cambios respecto a la versión anterior (RF-26); `null` en la primera versión.
          oneOf:
            - $ref: '#/components/schemas/ContractChanges'
            - type: 'null'
    ContractChanges:
      type: object
      additionalProperties: false
      required: [previous_version, added, modified, removed]
      properties:
        previous_version:
          type: integer
          description: '`number` de la versión con la que se compara.'
        added:
          type: array
          items:
            $ref: '#/components/schemas/OperationRef'
        modified:
          type: array
          items:
            $ref: '#/components/schemas/OperationRef'
        removed:
          type: array
          items:
            $ref: '#/components/schemas/OperationRef'
    OperationRef:
      type: object
      additionalProperties: false
      required: [id, method, path]
      properties:
        id:
          type: string
          format: uuid
        method:
          $ref: '#/components/schemas/HttpMethod'
        path:
          type: string
    ContractPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContractVersionSummary'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1

    # ---------- Operations ----------
    Operation:
      type: object
      additionalProperties: false
      description: Operación del proyecto, estable entre versiones del contrato. Los textos vienen del contrato y no son confiables.
      required: [id, method, path, operation_id, summary, tags, parameters, body, security, retired_at, suggested_policy, policy, owner_field, confirmed_at, modified_at, resource_parameters, is_login_candidate]
      properties:
        id:
          type: string
          format: uuid
        method:
          $ref: '#/components/schemas/HttpMethod'
        path:
          type: string
          description: Ruta tal como aparece en la versión vigente (o en la última que la incluyó, si fue retirada).
          examples: ['/users/{userId}/orders']
        operation_id:
          type: [string, 'null']
        summary:
          type: [string, 'null']
          description: '`summary` de la operación.'
        tags:
          type: array
          items:
            type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/Parameter'
        body:
          description: Cuerpo de la petición; `null` si no tiene.
          oneOf:
            - $ref: '#/components/schemas/RequestBody'
            - type: 'null'
        security:
          type: array
          description: Esquemas de seguridad declarados; vacío si la operación es pública según el contrato.
          items:
            $ref: '#/components/schemas/DeclaredSecurity'
        retired_at:
          type: [string, 'null']
          format: date-time
          description: Fecha en que dejó de aparecer en el contrato; `null` si está vigente.
        suggested_policy:
          description: Plantilla que propone el sistema a partir de la seguridad declarada y la forma de la ruta (RF-40).
          oneOf:
            - $ref: '#/components/schemas/Policy'
            - type: 'null'
        policy:
          description: Plantilla confirmada por el analista; `null` mientras no la confirme (RN-08). Una operación retirada con política es una regla huérfana.
          oneOf:
            - $ref: '#/components/schemas/Policy'
            - type: 'null'
        owner_field:
          type: [string, 'null']
          description: Parámetro o campo que identifica al propietario (RF-41).
        confirmed_at:
          type: [string, 'null']
          format: date-time
        modified_at:
          type: [string, 'null']
          format: date-time
          description: Última modificación de la política por el analista (RF-43).
        resource_parameters:
          type: array
          description: Parámetros de ruta que identifican recursos, propuestos al importar y corregibles (RF-35).
          items:
            $ref: '#/components/schemas/ResourceParameter'
        is_login_candidate:
          type: boolean
          description: El sistema la propone como operación de login para las identidades `login` (RF-30).
    Parameter:
      type: object
      additionalProperties: false
      required: [name, location, required, type]
      properties:
        name:
          type: string
        location:
          type: string
          enum: [path, query, header, cookie]
        required:
          type: boolean
        type:
          type: [string, 'null']
          description: Tipo del esquema (`string`, `integer`…), o `null` si no se declaró.
    RequestBody:
      type: object
      additionalProperties: false
      required: [required, content_types]
      properties:
        required:
          type: boolean
        content_types:
          type: array
          items:
            type: string
          examples: [['application/json']]
    DeclaredSecurity:
      type: object
      additionalProperties: false
      required: [scheme, type]
      properties:
        scheme:
          type: string
          description: Nombre del esquema en `components.securitySchemes`.
        type:
          type: string
          enum: [http_bearer, http_basic, api_key, oauth2, openid_connect, other]
    OperationPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1

    # ---------- Policy ----------
    Policy:
      type: string
      description: Plantilla de política (RF-39).
      enum: [public, authenticated, owner_only, owner_or_admin, admin_only]
    ResourceParameter:
      type: object
      additionalProperties: false
      description: Un parámetro de ruta que identifica un recurso (RF-35).
      required: [name, resource_type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[^\x00-\x1F\x7F]*$'
          description: Nombre del parámetro de ruta, como en `path` (`orderId`).
        resource_type:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[^\x00-\x1F\x7F]*$'
          description: Tipo de recurso, el mismo que usan los recursos registrados (`pedido`).
    OperationUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        policy:
          description: Plantilla confirmada; `null` la deja sin confirmar.
          oneOf:
            - $ref: '#/components/schemas/Policy'
            - type: 'null'
        owner_field:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          pattern: '^[^\x00-\x1F\x7F]*$'
          description: |
            Parámetro o campo que identifica al propietario (RF-41): un parámetro de ruta (`userId`) o un
            campo de la respuesta en notación de puntos (`owner.id`). Obligatorio con `owner_only` y
            `owner_or_admin`.
        resource_parameters:
          type: array
          maxItems: 20
          description: Reemplaza la selección completa.
          items:
            $ref: '#/components/schemas/ResourceParameter'
    PolicyBulkUpdate:
      type: object
      additionalProperties: false
      required: [operation_ids, policy]
      properties:
        operation_ids:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          items:
            type: string
            format: uuid
        policy:
          $ref: '#/components/schemas/Policy'
        owner_field:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
          pattern: '^[^\x00-\x1F\x7F]*$'
    PolicyBulkResult:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Operation'

    # ---------- Identities ----------
    IdentityRole:
      type: string
      description: Rol en la API del analista (RF-28). Lo usan los módulos de autorización (RF-57).
      enum: [admin, user, other]
    AuthType:
      type: string
      description: '`none` es solo la identidad anónima (RF-34); no se puede crear.'
      enum: [none, login, bearer, cookie, header]
    IdentityStatus:
      type: string
      description: '`expired_credential` cuando la credencial venció durante una ejecución (RF-33).'
      enum: [active, expired_credential]
    LoginCredential:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[^\x00-\x1F\x7F]*$'
        password:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[^\x00-\x1F\x7F]*$'
    TokenCredential:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[^\x00-\x1F\x7F]*$'
          description: Sin el prefijo `Bearer `.
    ValueCredential:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[^\x00-\x1F\x7F]*$'
          description: Valor de la cookie o de la cabecera.
    Credential:
      writeOnly: true
      description: |
        Nunca vuelve en una respuesta (RN-11). Su forma depende de `auth_type`: `login` →
        `LoginCredential`, `bearer` → `TokenCredential`, `cookie` y `header` → `ValueCredential`.
      oneOf:
        - $ref: '#/components/schemas/LoginCredential'
        - $ref: '#/components/schemas/TokenCredential'
        - $ref: '#/components/schemas/ValueCredential'
    IdentityCreate:
      type: object
      additionalProperties: false
      required: [name, role, auth_type, credential]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[^\x00-\x1F\x7F]*$'
          description: Se recortan los espacios de los extremos. Único entre las identidades del proyecto.
        role:
          $ref: '#/components/schemas/IdentityRole'
        role_label:
          type: [string, 'null']
          maxLength: 100
          pattern: '^[^\x00-\x1F\x7F]*$'
          description: Rol como lo llama la API del analista (`vendedor`), texto libre (RF-28).
        auth_type:
          type: string
          enum: [login, bearer, cookie, header]
        credential:
          $ref: '#/components/schemas/Credential'
        field_name:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
          pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
          description: |
            Nombre de la cookie o de la cabecera; obligatorio con `cookie` y `header`. No se admiten las
            cabeceras que controla la plataforma (`Host`, `Content-Length`, `Transfer-Encoding`,
            `Connection`, `Cookie` con `header`, …).
        login_operation_id:
          type: [string, 'null']
          format: uuid
          description: Operación de login (RF-30); obligatoria con `login`. Las candidatas traen `is_login_candidate`.
    IdentityUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[^\x00-\x1F\x7F]*$'
        role:
          $ref: '#/components/schemas/IdentityRole'
        role_label:
          type: [string, 'null']
          maxLength: 100
          pattern: '^[^\x00-\x1F\x7F]*$'
        auth_type:
          type: string
          enum: [login, bearer, cookie, header]
        credential:
          $ref: '#/components/schemas/Credential'
        field_name:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
          pattern: "^[!#$%&'*+.^_`|~0-9A-Za-z-]+$"
        login_operation_id:
          type: [string, 'null']
          format: uuid
    Identity:
      type: object
      additionalProperties: false
      required: [id, name, role, role_label, auth_type, credential_suffix, field_name, login_operation, status, last_tested_at, last_test_status_code, resource_count, warnings, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: '#/components/schemas/IdentityRole'
        role_label:
          type: [string, 'null']
        auth_type:
          $ref: '#/components/schemas/AuthType'
        credential_suffix:
          type: [string, 'null']
          maxLength: 4
          description: |
            Últimos 4 caracteres de la credencial (RF-31): del token, del valor o, en `login`, del
            usuario (la contraseña no se muestra ni en parte). `null` en la anónima.
        field_name:
          type: [string, 'null']
        login_operation:
          description: Operación de login; `null` si no es `login`.
          oneOf:
            - $ref: '#/components/schemas/OperationRef'
            - type: 'null'
        status:
          $ref: '#/components/schemas/IdentityStatus'
        last_tested_at:
          type: [string, 'null']
          format: date-time
        last_test_status_code:
          type: [integer, 'null']
          description: Código HTTP de la última prueba; `null` si nunca se probó o no hubo respuesta.
        resource_count:
          type: integer
          minimum: 0
        warnings:
          type: array
          description: '`identity.no_resources` (persistente, RF-38): el módulo de acceso a objetos no podrá probarla.'
          items:
            $ref: '#/components/schemas/Warning'
        created_at:
          type: string
          format: date-time
    IdentityPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
    IdentityTestRequest:
      type: object
      additionalProperties: false
      properties:
        operation_id:
          type: [string, 'null']
          format: uuid
          description: Operación GET con la que probar; si falta, la elige el sistema.
    IdentityTest:
      type: object
      additionalProperties: false
      required: [succeeded, status_code, failure, operation, tested_at]
      properties:
        succeeded:
          type: boolean
          description: '`true` si la operación respondió 2xx con la credencial.'
        status_code:
          type: [integer, 'null']
          description: Código HTTP recibido (RF-32); `null` si no hubo respuesta.
        failure:
          type: [string, 'null']
          enum: [rejected, login_failed, connection_error, destination_not_allowed, null]
          description: |
            Por qué falló; `null` si funcionó. `rejected`: la operación no respondió 2xx.
            `login_failed`: la operación de login no respondió 2xx o no devolvió un token.
            `connection_error`: sin respuesta o tiempo agotado. `destination_not_allowed`: la guardia SSRF
            bloqueó el destino.
        operation:
          $ref: '#/components/schemas/OperationRef'
        tested_at:
          type: string
          format: date-time

    # ---------- Resources ----------
    ResourceCreate:
      type: object
      additionalProperties: false
      required: [identity_id, resource_type, value]
      properties:
        identity_id:
          type: string
          format: uuid
        resource_type:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[^\x00-\x1F\x7F]*$'
        value:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '^[^\x00-\x1F\x7F]*$'
          description: Identificador del objeto en la API del analista (`101`).
    ResourceUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        identity_id:
          type: string
          format: uuid
        resource_type:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[^\x00-\x1F\x7F]*$'
        value:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '^[^\x00-\x1F\x7F]*$'
        confirmed:
          type: boolean
    Resource:
      type: object
      additionalProperties: false
      required: [id, identity_id, resource_type, value, source, confirmed, created_at]
      properties:
        id:
          type: string
          format: uuid
        identity_id:
          type: string
          format: uuid
        resource_type:
          type: string
        value:
          type: string
        source:
          type: string
          enum: [discovered, manual]
        confirmed:
          type: boolean
          description: Los recursos descubiertos llegan sin confirmar; los manuales, confirmados.
        created_at:
          type: string
          format: date-time
    ResourcePage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
    ResourceDiscoveryRequest:
      type: object
      additionalProperties: false
      properties:
        identity_ids:
          type: array
          description: Identidades que se usan. Sin el campo, todas las vigentes menos la anónima.
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            format: uuid
    ResourceDiscovery:
      type: object
      additionalProperties: false
      required: [created, identities, requests_sent, truncated]
      properties:
        created:
          type: array
          description: Recursos nuevos, sin confirmar, ordenados por tipo y luego por identificador.
          items:
            $ref: '#/components/schemas/Resource'
        identities:
          type: array
          items:
            $ref: '#/components/schemas/DiscoveryIdentityResult'
        requests_sent:
          type: integer
          minimum: 0
        truncated:
          type: boolean
          description: Se alcanzó el tope de 100 peticiones o de 25 segundos; puede haber más recursos.
    DiscoveryIdentityResult:
      type: object
      additionalProperties: false
      required: [identity_id, found, created, owned_by_other, failure]
      properties:
        identity_id:
          type: string
          format: uuid
        found:
          type: integer
          minimum: 0
          description: Identificadores que devolvieron sus listados.
        created:
          type: integer
          minimum: 0
          description: Cuántos de ellos eran nuevos y se registraron.
        owned_by_other:
          type: integer
          minimum: 0
          description: Cuántos se omitieron porque ya pertenecen a otra identidad.
        failure:
          type: [string, 'null']
          enum: [rejected, login_failed, connection_error, destination_not_allowed, not_attempted, null]
          description: |
            `null` si sus listados respondieron. Los cuatro primeros significan lo mismo que en
            `IdentityTest.failure`. `not_attempted`: se alcanzó un tope antes de llegar a esta identidad.

    # ---------- Runs ----------
    RunLimitsInput:
      type: object
      additionalProperties: false
      description: Límites por ejecución (RF-47). Los que no se envían toman su valor por defecto.
      properties:
        requests_per_second:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        concurrency:
          type: integer
          minimum: 1
          maximum: 5
          default: 2
          description: Peticiones en vuelo a la vez.
        max_requests:
          type: integer
          minimum: 1
          maximum: 5000
          default: 5000
        max_duration_minutes:
          type: integer
          minimum: 1
          maximum: 30
          default: 30
    RunLimits:
      type: object
      additionalProperties: false
      description: Los límites efectivos de la ejecución (RF-47).
      required: [requests_per_second, concurrency, max_requests, max_duration_minutes]
      properties:
        requests_per_second:
          type: integer
          minimum: 1
          maximum: 20
        concurrency:
          type: integer
          minimum: 1
          maximum: 5
        max_requests:
          type: integer
          minimum: 1
          maximum: 5000
        max_duration_minutes:
          type: integer
          minimum: 1
          maximum: 30
    RunCreate:
      type: object
      additionalProperties: false
      required: [modules]
      properties:
        modules:
          type: array
          description: Uno o varios módulos (RF-44). «Prueba completa» es enviar todos los disponibles.
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Module'
        limits:
          $ref: '#/components/schemas/RunLimitsInput'
        confirm_risk:
          type: boolean
          default: false
          description: |
            El analista confirmó la advertencia de los módulos de riesgo medio y alto (RN-05, RF-46).
            Obligatorio en `true` si `modules` incluye alguno; sin ellos se ignora.
    RunRerun:
      type: object
      additionalProperties: false
      description: Volver a probar (RF-71). Los módulos y los límites se copian de la ejecución original.
      properties:
        confirm_risk:
          type: boolean
          default: false
          description: |
            Igual que en `RunCreate`: obligatorio en `true` si la ejecución original incluye un módulo
            de riesgo medio o alto (RN-05, RF-46).
    Run:
      type: object
      additionalProperties: false
      description: Una ejecución con su configuración, su progreso y su resumen (RF-51, RF-63).
      required: [id, number, status, end_reason, modules, limits, risk_confirmed, contract_version, source_run_id, progress, created_resources, cancel_requested_at, created_at, started_at, finished_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/RunStatus'
        end_reason:
          description: '`null` mientras la ejecución está activa.'
          oneOf:
            - $ref: '#/components/schemas/EndReason'
            - type: 'null'
        modules:
          type: array
          description: En el orden del catálogo.
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Module'
        limits:
          $ref: '#/components/schemas/RunLimits'
        risk_confirmed:
          type: boolean
          description: Se confirmó la advertencia de riesgo medio o alto (RN-05).
        contract_version:
          description: Versión del contrato con la que se generaron las pruebas (RNF-19).
          oneOf:
            - $ref: '#/components/schemas/ContractVersionSummary'
            - type: 'null'
        source_run_id:
          type: [string, 'null']
          format: uuid
          description: La ejecución que esta vuelve a probar (`rerunRun`, RF-71); `null` en las demás.
        progress:
          $ref: '#/components/schemas/RunProgress'
        created_resources:
          $ref: '#/components/schemas/CreatedResourceCount'
        cancel_requested_at:
          type: [string, 'null']
          format: date-time
          description: Cuando el analista pidió cancelarla; `null` si no lo hizo.
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
    RunProgress:
      type: object
      additionalProperties: false
      description: Foto del progreso (RF-51). Es el `data` del evento `progress`.
      required: [status, current_module, requests_sent, cells_planned, cells_evaluated, percent, findings_by_severity, updated_at]
      properties:
        status:
          $ref: '#/components/schemas/RunStatus'
        current_module:
          description: Módulo en curso; `null` en cola y al terminar.
          oneOf:
            - $ref: '#/components/schemas/Module'
            - type: 'null'
        requests_sent:
          type: integer
          minimum: 0
        cells_planned:
          type: integer
          minimum: 0
          description: Celdas (módulo, operación, identidad) que la ejecución planea evaluar; 0 en cola.
        cells_evaluated:
          type: integer
          minimum: 0
          description: Celdas terminadas, con cualquier veredicto.
        percent:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            `cells_evaluated` entre `cells_planned`, redondeado hacia abajo. Llega a 100 solo si terminó
            con `end_reason: normal`; si se cancela, falla o alcanza un límite, queda donde iba.
        findings_by_severity:
          $ref: '#/components/schemas/SeverityCount'
          description: Fallas detectadas en esta ejecución hasta el momento.
        updated_at:
          type: string
          format: date-time
    CreatedResourceCount:
      type: object
      additionalProperties: false
      description: |
        Recursos que la plataforma creó en la API del analista (RN-06). `failed`: no se pudieron borrar
        tras 3 intentos y el analista debe borrarlos a mano (CU-23 E1).
      required: [pending, deleted, failed]
      properties:
        pending:
          type: integer
          minimum: 0
        deleted:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
    RunPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
    IdentityRef:
      type: object
      additionalProperties: false
      required: [id, name, deleted]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        deleted:
          type: boolean
          description: La identidad se eliminó después de la ejecución; sus celdas se conservan.
    Result:
      type: object
      additionalProperties: false
      description: Una celda de la matriz identidad × operación (RF-64).
      required: [module, operation, identity, expected, observed, verdict, evaluated_at]
      properties:
        module:
          $ref: '#/components/schemas/Module'
        operation:
          description: '`null` en las comprobaciones de toda la API (por ejemplo, CORS en Configuración).'
          oneOf:
            - $ref: '#/components/schemas/OperationRef'
            - type: 'null'
        identity:
          $ref: '#/components/schemas/IdentityRef'
        expected:
          type: string
          maxLength: 200
          description: |
            Lo que la política confirmada (o el módulo) espera, en un código corto y estable:
            `allowed`, `denied`, `own_data_only`, `no_sql_error`… El frontend lo traduce si lo conoce.
        observed:
          type: string
          maxLength: 200
          description: Lo que respondió la API, con el mismo vocabulario y el código HTTP (`200 allowed`).
        verdict:
          $ref: '#/components/schemas/Verdict'
        evaluated_at:
          type: string
          format: date-time
    ResultPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Result'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1

    # ---------- Findings ----------
    Severity:
      type: string
      description: RF-62. De mayor a menor.
      enum: [critical, high, medium, low, info]
    FindingStatus:
      type: string
      description: |
        RF-69 (modelo de datos, sección 4.3). Abiertos: `new`, `persistent` y `regression`. Cerrados:
        `resolved` y `accepted_risk` (que incluye el falso positivo; el motivo está en `dismissal`).
      enum: [new, persistent, resolved, regression, accepted_risk]
    DismissalReason:
      type: string
      enum: [accepted_risk, false_positive]
    ResolutionReason:
      type: string
      description: |
        `not_detected`: una ejecución volvió a evaluar su comprobación y no lo detectó (RF-68).
        `identity_deleted` y `operation_retired`: se eliminó la identidad o la operación salió del
        contrato (RF-69).
      enum: [not_detected, identity_deleted, operation_retired]
    FindingEventReason:
      type: string
      enum: [detected, not_detected, regression, accepted, false_positive, reverted, identity_deleted, operation_retired]
    RunRef:
      type: object
      additionalProperties: false
      required: [id, number]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
    FindingSummary:
      type: object
      additionalProperties: false
      description: |
        Fila de la lista de hallazgos (RF-65). `severity`, `owasp_category`, `cwe` y `title` son los de
        la ocurrencia más reciente.
      required: [id, module, finding_type, title, severity, owasp_category, cwe, status, operation, identity, detected_at, last_detected_at, resolved_at, first_run, last_run]
      properties:
        id:
          type: string
          format: uuid
        module:
          $ref: '#/components/schemas/Module'
        finding_type:
          type: string
          maxLength: 200
          description: |
            Código estable del tipo de falla en el catálogo del módulo, con su calificador cuando hace
            falta (`object_access.unauthorized_read`, `configuration.missing_header.hsts`). Forma parte de la
            huella (RF-68). El frontend lo puede usar para agrupar.
        title:
          type: string
          description: Título en español, escrito por la plataforma.
        severity:
          $ref: '#/components/schemas/Severity'
        owasp_category:
          type: string
          description: Categoría del OWASP API Security Top 10 2023 (`API1:2023`).
          examples: ['API1:2023']
        cwe:
          type: [string, 'null']
          examples: ['CWE-639']
        status:
          $ref: '#/components/schemas/FindingStatus'
        operation:
          description: '`null` en los hallazgos de toda la API (por ejemplo, CORS en Configuración).'
          oneOf:
            - $ref: '#/components/schemas/OperationRef'
            - type: 'null'
        identity:
          $ref: '#/components/schemas/IdentityRef'
        detected_at:
          type: string
          format: date-time
          description: Primera detección.
        last_detected_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, 'null']
          format: date-time
          description: Solo en `resolved`.
        first_run:
          $ref: '#/components/schemas/RunRef'
        last_run:
          $ref: '#/components/schemas/RunRef'
          description: La última ejecución que lo detectó.
    Finding:
      type: object
      additionalProperties: false
      description: |
        Un hallazgo con su clasificación, recomendación, evidencia e historial (RF-62, RF-66, RF-72). Tiene
        los campos de `FindingSummary` y además `recommendation`, `dismissal`, `resolution_reason`,
        `last_occurrence` y `history`.
      required: [id, module, finding_type, title, severity, owasp_category, cwe, status, operation, identity, detected_at, last_detected_at, resolved_at, first_run, last_run, recommendation, dismissal, resolution_reason, last_occurrence, history]
      properties:
        id:
          type: string
          format: uuid
        module:
          $ref: '#/components/schemas/Module'
        finding_type:
          type: string
          maxLength: 200
        title:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        owasp_category:
          type: string
        cwe:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/FindingStatus'
        operation:
          oneOf:
            - $ref: '#/components/schemas/OperationRef'
            - type: 'null'
        identity:
          $ref: '#/components/schemas/IdentityRef'
        detected_at:
          type: string
          format: date-time
        last_detected_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, 'null']
          format: date-time
        first_run:
          $ref: '#/components/schemas/RunRef'
        last_run:
          $ref: '#/components/schemas/RunRef'
        recommendation:
          type: string
          description: Recomendación de corrección en español (RF-62), escrita por la plataforma.
        dismissal:
          description: Solo en `accepted_risk`.
          oneOf:
            - $ref: '#/components/schemas/Dismissal'
            - type: 'null'
        resolution_reason:
          description: Solo en `resolved`.
          oneOf:
            - $ref: '#/components/schemas/ResolutionReason'
            - type: 'null'
        last_occurrence:
          $ref: '#/components/schemas/FindingOccurrence'
        history:
          type: array
          description: |
            Cambios de estado, del más antiguo al más reciente (RF-72). El primero es siempre `detected`.
            Una ejecución que lo vuelve a detectar sin cambiarle el estado no agrega un evento: eso está
            en sus ocurrencias.
          items:
            $ref: '#/components/schemas/FindingEvent'
    Dismissal:
      type: object
      additionalProperties: false
      required: [reason, justification, dismissed_at]
      properties:
        reason:
          $ref: '#/components/schemas/DismissalReason'
        justification:
          type: string
        dismissed_at:
          type: string
          format: date-time
    DismissalCreate:
      type: object
      additionalProperties: false
      required: [reason, justification]
      properties:
        reason:
          $ref: '#/components/schemas/DismissalReason'
        justification:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '^[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$'
          description: |
            Obligatoria (RN-09). Se recortan los espacios de los extremos; si no queda texto, es
            `validation.required`. Admite tabulador y saltos de línea; ningún otro carácter de control.
    FindingOccurrence:
      type: object
      additionalProperties: false
      description: Una detección del hallazgo en una ejecución, con su evidencia (RF-66).
      required: [run, severity, explanation, evidence, detected_at]
      properties:
        run:
          $ref: '#/components/schemas/RunRef'
        severity:
          $ref: '#/components/schemas/Severity'
        explanation:
          type: string
          description: |
            Por qué es una falla, en español, escrita por la plataforma. Puede citar nombres de
            identidades y valores de recursos del analista.
        evidence:
          $ref: '#/components/schemas/Evidence'
        detected_at:
          type: string
          format: date-time
    Evidence:
      type: object
      additionalProperties: false
      description: |
        La petición y la respuesta que reproducen la falla (RF-66). Las credenciales y los tokens ya
        vienen enmascarados, con solo sus últimos 4 caracteres (`****abcd`, RN-11, RF-31), también si la
        API los repitió en la respuesta. Las cabeceras y el cuerpo de la respuesta vienen de la API del
        analista y **no son confiables**: se muestran siempre como texto.
      required: [request, response, context]
      properties:
        request:
          type: object
          additionalProperties: false
          required: [method, url, headers, body]
          properties:
            method:
              $ref: '#/components/schemas/HttpMethod'
            url:
              type: string
            headers:
              type: object
              description: Nombres en minúsculas. Hasta 50 cabeceras de hasta 500 caracteres.
              additionalProperties:
                type: string
            body:
              type: [string, 'null']
              description: '`null` si la petición no llevó cuerpo (hoy, siempre: las pruebas son de solo lectura, RF-48).'
        response:
          type: object
          additionalProperties: false
          required: [status_code, headers, body, body_truncated]
          properties:
            status_code:
              type: integer
              minimum: 100
              maximum: 599
            headers:
              type: object
              description: Nombres en minúsculas. Hasta 50 cabeceras de hasta 500 caracteres.
              additionalProperties:
                type: string
            body:
              type: string
              description: Hasta 10 KB (RF-67), decodificado como UTF-8.
            body_truncated:
              type: boolean
              description: El cuerpo original era más largo y se truncó (RF-67).
        context:
          type: object
          description: |
            Datos del módulo que ayudan a leer la evidencia. Sus claves dependen del módulo; el frontend
            muestra las que conoce y puede ignorar las demás. Hoy: `resource` (`type`, `value`, `owner`)
            en acceso a objetos y `control_identity` en acceso a funciones. Vacío si el módulo no agrega
            nada.
          additionalProperties: true
    FindingEvent:
      type: object
      additionalProperties: false
      description: |
        Un cambio de estado (RF-72). Lo causa una ejecución (`run`) o el analista (`run: null`): aceptar,
        revertir o eliminar una identidad.
      required: [from_status, to_status, reason, run, justification, occurred_at]
      properties:
        from_status:
          description: '`null` en la primera detección.'
          oneOf:
            - $ref: '#/components/schemas/FindingStatus'
            - type: 'null'
        to_status:
          $ref: '#/components/schemas/FindingStatus'
        reason:
          $ref: '#/components/schemas/FindingEventReason'
        run:
          oneOf:
            - $ref: '#/components/schemas/RunRef'
            - type: 'null'
        justification:
          type: [string, 'null']
          description: Solo en `accepted` y `false_positive`.
        occurred_at:
          type: string
          format: date-time
    FindingPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FindingSummary'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
    FindingOccurrencePage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FindingOccurrence'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1

    # ---------- Admin ----------
    AuditLogPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
    AuditLogEntry:
      type: object
      additionalProperties: false
      description: |
        Una acción sensible (RF-82). Sin credenciales, justificaciones, texto libre ni hosts en claro
        (RF-83). `user_id` y `project_id` son identificadores opacos: siguen ahí aunque la cuenta o el
        proyecto ya no existan.
      required: [id, occurred_at, action, user_id, project_id, source_ip, details]
      properties:
        id:
          type: integer
          minimum: 1
          description: Secuencial. Sirve para citar un registro y desempatar el orden.
        occurred_at:
          type: string
          format: date-time
        action:
          $ref: '#/components/schemas/AuditAction'
        user_id:
          type: [string, 'null']
          format: uuid
          description: Quien actuó, o el dueño del proyecto en las acciones del motor. `null` solo si no se conoce.
        project_id:
          type: [string, 'null']
          format: uuid
          description: '`null` en las acciones de cuenta y en un bloqueo al crear un proyecto.'
        source_ip:
          type: [string, 'null']
          description: |
            IP del navegador que informó el servidor de Next.js (`X-Hindama-Client-IP`). `null` en las
            acciones del motor de pruebas o si no llegó una IP válida.
          examples: ['203.0.113.25', '2001:db8::1']
        details:
          $ref: '#/components/schemas/AuditDetails'
    AuditAction:
      type: string
      description: |
        Catálogo de RF-81, más RN-09 y la pérdida de verificación.
        - `account_created`: primer acceso de una cuenta a la API.
        - `account_deleted`: reservado para la eliminación de cuentas; todavía no se emite.
        - `project_created`, `project_deleted`.
        - `project_verified`: verificación de propiedad exitosa. `project_verification_lost`: la
          reverificación al iniciar una ejecución falló (RF-20).
        - `identity_created`, `identity_deleted`.
        - `run_launched` (también al volver a probar) y `run_cancelled` (cancelada por el analista).
        - `finding_dismissed`: aceptar el riesgo o marcar un falso positivo (RN-09);
          `finding_dismissal_reverted`: revertirlo.
        - `destination_blocked`: la guardia SSRF impidió una petición o rechazó la URL de un proyecto (RF-11, RF-50).
      enum:
        - account_created
        - account_deleted
        - project_created
        - project_deleted
        - project_verified
        - project_verification_lost
        - identity_created
        - identity_deleted
        - run_launched
        - run_cancelled
        - finding_dismissed
        - finding_dismissal_reverted
        - destination_blocked
    AuditDetails:
      type: object
      additionalProperties: false
      description: |
        Datos propios de cada acción; los que no aplican no aparecen. Nunca credenciales,
        justificaciones ni texto libre del analista (RF-83).
      properties:
        run_id:
          type: string
          format: uuid
          description: '`run_launched`, `run_cancelled`, `project_verification_lost` y un `destination_blocked` del motor.'
        source_run_id:
          type: string
          format: uuid
          description: '`run_launched` al volver a probar (RF-71).'
        modules:
          type: array
          description: '`run_launched`.'
          items:
            $ref: '#/components/schemas/Module'
        limits:
          $ref: '#/components/schemas/RunLimits'
        verification_method:
          $ref: '#/components/schemas/VerificationMethod'
        identity_id:
          type: string
          format: uuid
          description: '`identity_created` e `identity_deleted`.'
        finding_id:
          type: string
          format: uuid
          description: '`finding_dismissed` y `finding_dismissal_reverted`.'
        dismissal_reason:
          $ref: '#/components/schemas/DismissalReason'
        stage:
          $ref: '#/components/schemas/BlockStage'
        block_reason:
          $ref: '#/components/schemas/BlockReason'
    BlockStage:
      type: string
      description: |
        Dónde se bloqueó el destino (`destination_blocked`): al crear o editar el proyecto, al
        verificarlo, al importar el contrato por URL, al probar una identidad, al descubrir recursos o
        durante una ejecución.
      enum: [project_url, verification, contract_import, identity_test, resource_discovery, run]
    BlockReason:
      type: string
      description: |
        Motivo del bloqueo (RF-11, RF-50): `address_not_allowed` (IP privada, loopback, enlace local,
        metadatos de nube o propia de Hindama), `host_mismatch` (redirección fuera del host del
        proyecto), `unresolved`, `invalid_url`, `scheme_not_allowed` o `too_many_redirects`.
      enum: [address_not_allowed, host_mismatch, unresolved, invalid_url, scheme_not_allowed, too_many_redirects]
