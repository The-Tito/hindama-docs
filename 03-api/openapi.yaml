  /projects/{project_id}/runs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Runs]
      operationId: listRuns
      summary: Ejecuciones del proyecto
      description: |
        Resumen de cada ejecución (RF-63). Orden: de la más reciente a la más antigua (`number`
        descendente). Para filtrar por varios estados se repite `status`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/RunStatus'
      responses:
        '200':
          description: Página de ejecuciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPage'
              examples:
                runPage:
                  $ref: '#/components/examples/RunPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Runs]
      operationId: createRun
      summary: Lanzar una ejecución
      description: |
        CU-12, RF-44 a RF-48. Valida en este orden:

        1. El proyecto está verificado (RN-01) y no tiene otra ejecución activa (RN-07).
        2. Cada módulo pedido cumple sus requisitos (RF-45). Son los mismos que `modules[].missing` del
           dashboard del proyecto.
        3. Si hay un módulo de riesgo medio o alto, `confirm_risk` es `true` (RN-05, RF-46). La
           confirmación vale solo para esta ejecución.
        4. Los límites están dentro de sus topes (RF-47); los que no se envían toman su valor por defecto.

        Crea la ejecución en `queued` con la versión vigente del contrato, la encola y responde 202 con el
        recurso en su estado inicial. El progreso se sigue con `streamRunEvents` o con `getRun`.

        Las pruebas son de solo lectura por defecto (RF-48). Solo los módulos de riesgo medio y alto
        escriben, y únicamente sobre recursos que crea la propia plataforma y borra al terminar (RN-06).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
            examples:
              withRiskyModule:
                $ref: '#/components/examples/RunCreate'
      responses:
        '202':
          description: Ejecución en cola.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
              examples:
                queuedRun:
                  $ref: '#/components/examples/QueuedRun'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`project.not_verified` (RN-01) o `project.active_run` (RN-07, CU-12 E1).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            - `validation.*`.
            - `run.module_unavailable`: un módulo no cumple sus requisitos. `errors[].field` es
              `modules.N`; lo que falta está en `modules[].missing` del dashboard.
            - `run.risk_not_confirmed`: hay un módulo de riesgo medio o alto y `confirm_risk` no es
              `true`. `errors[].field` es `confirm_risk`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                moduleUnavailable:
                  $ref: '#/components/examples/ModuleUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'

  /projects/{project_id}/runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRun
      summary: Consultar una ejecución
      description: |
        Configuración, resumen (RF-63) y foto del progreso (RF-51). Sirve para recuperar el estado cuando
        se pierde el stream (CU-13 A1) y para mostrar una ejecución terminada.
      responses:
        '200':
          description: La ejecución.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
              examples:
                runningRun:
                  $ref: '#/components/examples/RunningRun'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/runs/{run_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: cancelRun
      summary: Cancelar una ejecución
      description: |
        CU-14, RF-52. Sin cuerpo.

        - En `queued`, la ejecución pasa de inmediato a `cancelled` con `end_reason: cancelled_by_user`.
        - En `running`, se envía la señal al motor y la respuesta trae `cancel_requested_at`. El motor
          se detiene en menos de 5 segundos, borra los recursos que creó (RN-06), conserva los resultados
          parciales y el stream emite `end`.

        Repetirla mientras la ejecución se detiene responde lo mismo.
      responses:
        '202':
          description: Cancelación aceptada. La ejecución en su estado actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`run.not_active`: la ejecución ya terminó.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'

  /projects/{project_id}/runs/{run_id}/rerun:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: rerunRun
      summary: Volver a probar
      description: |
        CU-17, RF-71. Lanza una ejecución nueva con la misma configuración (`modules` y `limits`) que
        `run_id`, que puede ser cualquier ejecución terminada del proyecto. La nueva trae
        `source_run_id` igual a `run_id`; lo demás es como en `createRun`.

        Valida lo mismo y en el mismo orden que `createRun`:

        1. El proyecto está verificado (RN-01) y no tiene otra ejecución activa (RN-07). Si `run_id`
           sigue activa, responde `project.active_run`.
        2. Cada módulo de la ejecución original sigue cumpliendo sus requisitos (RF-45). Si uno ya no
           los cumple, responde `run.module_unavailable`: no se quita en silencio.
        3. Si hay un módulo de riesgo medio o alto, `confirm_risk` es `true` (RN-05, RF-46). La
           confirmación de la ejecución original no vale: se pide en cada ejecución.

        Responde 202 con la ejecución en `queued`, con la versión vigente del contrato (que puede ser
        más nueva que la de la original).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRerun'
            examples:
              confirmed:
                summary: Repite una ejecución con un módulo de riesgo
                value:
                  confirm_risk: true
      responses:
        '202':
          description: Ejecución en cola.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
              examples:
                queuedRerun:
                  $ref: '#/components/examples/QueuedRerun'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`project.not_verified` (RN-01) o `project.active_run` (RN-07).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            - `validation.*`.
            - `run.module_unavailable`: un módulo de la ejecución original ya no cumple sus requisitos.
              `errors[].field` es `modules.N`, con `N` la posición en `modules` de la original.
            - `run.risk_not_confirmed`: hay un módulo de riesgo medio o alto y `confirm_risk` no es
              `true`. `errors[].field` es `confirm_risk`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'

  /projects/{project_id}/runs/{run_id}/events:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: streamRunEvents
      summary: Progreso en tiempo real (SSE)
      description: |
        CU-13, RF-51, ADR-006. Stream `text/event-stream`. Next.js lo retransmite sin guardarlo ni
        transformarlo, y cierra la conexión con FastAPI cuando el navegador la cierra.

        Eventos (`data` es JSON en una sola línea):

        | `event` | `data` | Cuándo |
        | --- | --- | --- |
        | `snapshot` | `Run` | Siempre primero, leído de la base de datos. También al reconectar. |
        | `progress` | `RunProgress` | Cada vez que el motor avanza, con un retraso menor a 2 s (RNF-03). |
        | `end` | `Run` | La ejecución terminó. El servidor cierra el stream después. |

        - Cada evento lleva `id:`. Al reconectar con `Last-Event-ID`, la respuesta vuelve a empezar
          con `snapshot` (CU-13 A1).
        - Cada 15 segundos llega un comentario `: ping` para mantener viva la conexión.
        - Si la ejecución ya terminó, el stream envía `snapshot` y `end` y se cierra.

        Abrir el stream cuenta como una petición en el límite por usuario; sus eventos no cuentan.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Último `id:` recibido. Lo envía el navegador al reconectar.
          schema:
            type: string
            maxLength: 64
            pattern: '^[^\x00-\x1F\x7F]*$'
      responses:
        '200':
          description: Stream de eventos.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                retry: 3000

                id: 1
                event: snapshot
                data: {"id":"0192e3a0-7777-7000-8000-000000000003","number":3,"status":"running", …}

                id: 2
                event: progress
                data: {"status":"running","current_module":"object_access","requests_sent":42, …}

                : ping

        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/runs/{run_id}/results:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: listRunResults
      summary: Matriz identidad × operación
      description: |
        RF-64. Cada elemento es una celda evaluada: módulo, operación e identidad, con lo esperado, lo
        observado y el veredicto. Una discrepancia es `verdict: fail`. En una ejecución activa devuelve las
        celdas terminadas hasta el momento; una celda a medio evaluar no aparece.

        Orden: módulo (en el orden del catálogo), ruta, método y nombre de la identidad. Las comprobaciones
        de toda la API (`operation: null`) van primero dentro de su módulo. `page_size` acepta hasta 500,
        como `listOperations`. Para varios valores de `module` o `verdict` se repite el parámetro.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: module
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/Module'
        - name: verdict
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/Verdict'
        - name: identity_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: operation_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Página de celdas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPage'
              examples:
                resultPage:
                  $ref: '#/components/examples/ResultPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/findings:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Findings]
      operationId: listFindings
      summary: Hallazgos del proyecto
      description: |
        CU-15, RF-65. Cada hallazgo es una falla lógica que vive entre ejecuciones (RF-68): aparece una
        sola vez aunque se haya detectado en varias. Sin filtros trae todos los estados; los abiertos son
        `new`, `persistent` y `regression`.

        Orden: severidad (de `critical` a `info`), luego la detección más reciente primero
        (`last_detected_at`). Para varios valores de `module`, `severity` o `status` se repite el parámetro.

        `run_id` deja solo los hallazgos detectados en esa ejecución (los que tienen una ocurrencia en
        ella), con su estado y su severidad **actuales**; la severidad que tuvo en esa ejecución está en
        sus ocurrencias. Un `run_id`, `identity_id` u `operation_id` de otro proyecto no coincide con nada.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: module
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/Module'
        - name: severity
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/Severity'
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/FindingStatus'
        - name: run_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: identity_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: operation_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Página de hallazgos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingPage'
              examples:
                findingPage:
                  $ref: '#/components/examples/FindingPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/findings/{finding_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/FindingId'
    get:
      tags: [Findings]
      operationId: getFinding
      summary: Detalle de un hallazgo
      description: |
        CU-15, RF-62, RF-66, RF-72. Clasificación, recomendación, la ocurrencia más reciente con su
        evidencia y el historial de estados. Las ocurrencias anteriores están en
        `GET …/findings/{finding_id}/occurrences`.
      responses:
        '200':
          description: El hallazgo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Finding'
              examples:
                finding:
                  $ref: '#/components/examples/Finding'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/findings/{finding_id}/occurrences:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/FindingId'
    get:
      tags: [Findings]
      operationId: listFindingOccurrences
      summary: Ocurrencias de un hallazgo
      description: |
        RF-66, RF-72. Una por cada ejecución que detectó el hallazgo, con la evidencia de esa ejecución.
        Orden: de la ejecución más reciente a la más antigua. Cada evidencia puede pesar hasta 64 KB, por
        eso `page_size` acepta hasta 20.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: Página de ocurrencias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingOccurrencePage'
              examples:
                findingOccurrencePage:
                  $ref: '#/components/examples/FindingOccurrencePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/findings/{finding_id}/dismissal:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/FindingId'
    post:
      tags: [Findings]
      operationId: dismissFinding
      summary: Aceptar el riesgo o marcar como falso positivo
      description: |
        CU-16, RF-70, RN-09. Solo para un hallazgo abierto (`new`, `persistent` o `regression`). Pasa a
        `accepted_risk` con el motivo y la justificación, agrega un evento al historial (RF-72) y queda en
        la bitácora (RN-09). Un hallazgo aceptado que se vuelve a detectar sigue aceptado; solo gana una
        ocurrencia. Un proyecto sin hallazgos abiertos puede quedar concluido (RF-73).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DismissalCreate'
            examples:
              dismissalCreate:
                $ref: '#/components/examples/DismissalCreate'
      responses:
        '200':
          description: El hallazgo en `accepted_risk`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Finding'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`finding.not_open`: el hallazgo ya está resuelto o aceptado.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Findings]
      operationId: revertDismissal
      summary: Revertir la aceptación o el falso positivo
      description: |
        CU-16, RF-70. El hallazgo vuelve a `persistent` (aunque antes de aceptarlo fuera `new` o
        `regression`), con un evento `reverted` en el historial. Sin cuerpo. La siguiente ejecución que
        lo evalúe y no lo detecte lo resuelve, como a cualquier hallazgo abierto.
      responses:
        '204':
          description: Revertido.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`finding.not_dismissed`: el hallazgo no está en `accepted_risk`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /admin/audit-log:
    get:
      tags: [Admin]
      operationId: listAuditLog
      summary: Bitácora de acciones sensibles
      description: |
        CU-21, RF-81 a RF-84. Solo el administrador; el analista recibe 403. Los registros no se editan
        ni se eliminan desde la plataforma (RF-83) y se borran solos a los 6 meses (RF-90).

        Orden: el más reciente primero (`occurred_at`; `id` desempata).

        Filtros, todos opcionales y combinables:
        - `occurred_from` (incluido) y `occurred_to` (excluido) acotan la fecha. Van en RFC 3339 con
          hora y zona (`2026-11-20T00:00:00Z`, `2026-11-20T00:00:00-06:00`); una fecha sola, sin zona
          o en segundos Unix es 422 con `validation.format`, igual que un `occurred_from` posterior a
          `occurred_to` (en `occurred_to`).
        - `action` se repite para varios valores.
        - `user_id` deja las acciones de un usuario (el `id` interno, el mismo que lleva cada registro).
        - `host` deja las acciones sobre ese host (A1 de CU-21): el servidor calcula su HMAC con cada
          versión de la llave y compara. Acepta el nombre (`api.example.com`) o una URL completa; se
          compara sin mayúsculas, sin puerto y en IDNA, igual que el host de un proyecto. El host nunca
          se guarda ni se devuelve (RF-83). Un valor que no es un host es 422 con `validation.format`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: occurred_from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: occurred_to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: action
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/AuditAction'
        - name: user_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: host
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 2048
            pattern: '^[^\x00-\x1F\x7F]*$'
      responses:
        '200':
          description: Página de la bitácora.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
              examples:
                auditLogPage:
                  $ref: '#/components/examples/AuditLogPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AdminOnly'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de Amazon Cognito. Lo agrega el servidor de Next.js; el navegador nunca lo ve.

  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OperationId:
      name: operation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdentityId:
      name: identity_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    FindingId:
      name: finding_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    Location:
      description: Ruta del recurso creado.
      schema:
        type: string
    RetryAfter:
      description: Segundos que hay que esperar antes de reintentar.
      schema:
        type: integer
    WwwAuthenticate:
      schema:
        type: string
        example: Bearer

  responses:
    Malformed:
      description: '`request.malformed`: cuerpo ilegible o tipo de contenido incorrecto.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: '`validation.*`: un parámetro de la ruta o de la consulta no es válido (por ejemplo, un UUID mal formado).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: '`auth.required` o `auth.invalid_token`. Next.js debe renovar el token o cerrar la sesión.'
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RoleForbidden:
      description: '`role.forbidden`: el administrador no accede al contenido de los proyectos (RF-80).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AdminOnly:
      description: '`role.forbidden`: solo el administrador consulta el panel de administración (RF-84).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: '`resource.not_found`: no existe o pertenece a otro analista; las dos respuestas son idénticas (RN-02, RNF-05).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: '`rate_limit.exceeded`: más de 100 peticiones por minuto (RNF-09).'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: '`service.unavailable`: una dependencia no responde.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

