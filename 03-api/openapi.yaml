openapi: 3.1.0
info:
  title: Hindama API
  version: 0.7.0
  summary: API privada de la plataforma Hindama. Su único cliente es el servidor de Next.js (BFF).
  description: |
    Contrato de la API de la plataforma. Es la fuente de verdad: el backend lo implementa y el
    frontend lo consume (ADR-016). Las reglas comunes (errores, paginación, nombres, cabeceras)
    están en `convenciones.md`; la traducción de cada término del dominio, en `glosario-identificadores.md`.

    Alcance de la versión 0.2.0: endpoints de la semana 1, casos de uso CU-05 a CU-08 más `GET /me`.
    0.2.1: límites de entrada que el backend ya debía cumplir (máximo de `page`, texto sin caracteres de
    control, confirmación no vacía), encontrados por Schemathesis en la prueba técnica PT-03.
    0.3.0: identidades (CU-09), recursos manuales (CU-10) y política de acceso (CU-11), y los campos de
    política, parámetros de recurso y candidata a login en `Operation`.
    0.4.0: ejecuciones (CU-12 a CU-14): lanzar, listar, consultar y cancelar, progreso en tiempo real por
    SSE, matriz de resultados (RF-63, RF-64) y descubrimiento automático de recursos (RF-36). `RunSummary`
    gana campos.
    0.5.0: hallazgos (CU-15, CU-16, RF-65, RF-66, RF-70, RF-72): lista con filtros, detalle con evidencia
    e historial, ocurrencias por ejecución, y aceptar el riesgo o marcar un falso positivo y revertirlo.
    0.6.0: volver a probar (CU-17, RF-71): `rerunRun` repite una ejecución terminada con la misma
    configuración y llena `source_run_id`.
    0.7.0: bitácora (CU-21, RF-81 a RF-84, RN-09): `listAuditLog` para el administrador, con filtros por
    fecha, acción, usuario y host (comparando su HMAC).
    Los identificadores están en inglés (ADR-017). Los textos para el usuario los elige el frontend
    según el campo `code` de errores y advertencias.
servers:
  - url: https://backend.internal:8443
    description: API privada, solo accesible desde la EC2 del frontend.
  - url: http://localhost:8000
    description: Desarrollo local.
security:
  - bearerAuth: []
tags:
  - name: System
    description: Salud del servicio.
  - name: Account
    description: Datos del usuario de la sesión (CU-02, CU-05).
  - name: Projects
    description: Gestión de proyectos (CU-05, CU-06).
  - name: Verification
    description: Verificación de propiedad de la API (CU-07).
  - name: Contracts
    description: Importación del contrato OpenAPI y sus operaciones (CU-08).
  - name: Policy
    description: Política de acceso por operación y parámetros de recurso (CU-11, RF-35).
  - name: Identities
    description: Identidades de prueba de la API del analista (CU-09).
  - name: Resources
    description: Recursos de la API del analista por identidad (CU-10).
  - name: Runs
    description: Ejecuciones de pruebas, su progreso y sus resultados (CU-12 a CU-14, RF-63, RF-64).
  - name: Findings
    description: Hallazgos, su evidencia y su seguimiento entre ejecuciones (CU-15, CU-16, RF-65 a RF-72).
  - name: Admin
    description: Panel del administrador; nunca el contenido de los proyectos (RN-03, RF-80). Bitácora (CU-21).

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Estado del servicio
      description: Sin autenticación. Responde 200 si la API y la base de datos responden.
      security: []
      responses:
        '200':
          description: El servicio funciona.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Unavailable'

  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Usuario de la sesión
      description: |
        Datos del usuario autenticado. En su primer acceso, el usuario se da de alta en la plataforma.
        Next.js usa `role` solo para elegir la pantalla inicial; toda autorización la decide la API.
      responses:
        '200':
          description: Usuario de la sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                me:
                  $ref: '#/components/examples/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me/terms:
    post:
      tags: [Account]
      operationId: acceptTerms
      summary: Aceptar los términos de uso responsable
      description: Registra la fecha y la versión aceptada (RF-16, RN-12). Aceptar la misma versión otra vez no cambia nada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TermsAcceptance'
      responses:
        '200':
          description: Términos aceptados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                me:
                  $ref: '#/components/examples/Me'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: '`terms.outdated_version`: la versión enviada no es la vigente; volver a mostrar los términos.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: Proyectos del analista
      description: Solo los proyectos del usuario de la sesión (RF-12, RN-02). Orden por defecto `-created_at`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [created_at, -created_at, name, -name, last_run_at, -last_run_at]
            default: -created_at
      responses:
        '200':
          description: Página de proyectos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
              examples:
                projectPage:
                  $ref: '#/components/examples/ProjectPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Crear un proyecto
      description: |
        Crea el proyecto en estado `pending` con su código de verificación y su identidad anónima (CU-05).
        Exige haber aceptado los términos vigentes (RN-12).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Proyecto creado. Puede traer las advertencias `url.no_tls` o `url.unresolved`.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                newHttpProject:
                  $ref: '#/components/examples/NewHttpProject'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            `terms.not_accepted`: mostrar los términos y llamar a `acceptTerms` antes de reintentar.
            `role.forbidden`: el administrador no crea proyectos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                termsNotAccepted:
                  $ref: '#/components/examples/TermsNotAccepted'
        '422':
          description: |
            Errores de campo (`validation.*`) o de la URL base: `url.invalid_format`,
            `url.scheme_not_allowed`, `url.destination_not_allowed` (RF-11).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                urlNotAllowed:
                  $ref: '#/components/examples/UrlNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Dashboard del proyecto
      description: Estado de verificación, contrato vigente, módulos disponibles, última ejecución y hallazgos abiertos por severidad (RF-15).
      responses:
        '200':
          description: Proyecto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                project:
                  $ref: '#/components/examples/Project'
                newHttpProject:
                  $ref: '#/components/examples/NewHttpProject'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Editar nombre, descripción o URL base
      description: |
        Si cambia el host de la URL base, el proyecto vuelve a `pending` y la respuesta trae la
        advertencia `project.verification_lost` (RF-13).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Proyecto actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                project:
                  $ref: '#/components/examples/Project'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Errores de campo o de la URL base, igual que en `createProject`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Eliminar un proyecto
      description: Borra el proyecto y todo su contenido de forma permanente (RF-14).
      parameters:
        - name: confirmation
          in: query
          required: true
          description: Nombre exacto del proyecto, tal como lo escribió el analista.
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: '^[^\x00-\x1F\x7F]*$'
      responses:
        '204':
          description: Proyecto eliminado.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`project.active_run`: hay una ejecución en cola o en curso; cancelarla primero (CU-06 E2).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`project.confirmation_mismatch`: el nombre no coincide.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/verification:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Verification]
      operationId: getVerification
      summary: Instrucciones y estado de la verificación
      description: Código del proyecto y cómo publicarlo con cada método (CU-07 paso 2).
      responses:
        '200':
          description: Verificación del proyecto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
              examples:
                pendingVerification:
                  $ref: '#/components/examples/PendingVerification'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Verification]
      operationId: verifyOwnership
      summary: Comprobar la propiedad
      description: |
        Consulta el archivo `/.well-known/hindama-verificacion.txt` o el registro TXT
        `_hindama-verificacion.<host>` a través de la guardia SSRF (ADR-008). Es síncrona y puede tardar
        hasta 20 segundos. Verificar un proyecto ya verificado vuelve a comprobarlo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          description: El código coincide; el proyecto queda `verified`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            La verificación falló (RF-21). `code`: `verification.file_not_found`,
            `verification.content_mismatch`, `verification.txt_missing`, `verification.connection_error`
            o `verification.destination_not_allowed`. El campo `found` resume lo que se obtuvo. El
            proyecto queda `pending`. También puede ser un error de campo (`validation.*`), con el
            esquema `Problem`.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/VerificationProblem'
                  - $ref: '#/components/schemas/Problem'
              examples:
                failedVerification:
                  $ref: '#/components/examples/FailedVerification'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/contracts:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Contracts]
      operationId: listContracts
      summary: Versiones del contrato
      description: Todas las versiones importadas (RF-26). Orden por defecto `-number` (la más reciente primero).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de versiones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPage'
              examples:
                contractPage:
                  $ref: '#/components/examples/ContractPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Contracts]
      operationId: importContract
      summary: Importar una versión del contrato
      description: |
        Envía **exactamente uno** de `file` o `url` (CU-08). Acepta OpenAPI 3.0 y 3.1 en JSON o YAML,
        hasta 5 MB (RF-22). Resuelve solo referencias internas (RF-23). La importación por URL pasa por la
        guardia SSRF y se permite antes de verificar el proyecto (excepción de RN-01). Es síncrona: hasta
        10 segundos de análisis más hasta 20 de descarga.

        Si el documento es idéntico a la versión vigente, no se crea otra: responde `200` con la versión
        vigente y la advertencia `contract.unchanged`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContractImport'
            encoding:
              file:
                contentType: application/json, application/yaml, application/x-yaml, text/yaml, text/plain, application/octet-stream
      responses:
        '201':
          description: Nueva versión creada.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractVersion'
              examples:
                contractVersion:
                  $ref: '#/components/examples/ContractVersion'
        '200':
          description: El documento es idéntico a la versión vigente; trae la advertencia `contract.unchanged`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractVersion'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: '`contract.too_large`: más de 5 MB.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            `contract.source_required`, `contract.invalid` (con `errors[]`: el `field` es la ubicación en
            el documento, JSON Pointer o «línea N»), `contract.unsupported_version`,
            `contract.url_unreachable` o `contract.url_not_allowed`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidContract:
                  $ref: '#/components/examples/InvalidContract'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/contracts/{contract_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: contract_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Contracts]
      operationId: getContract
      summary: Una versión del contrato
      description: Avisos de la importación y diferencias con la versión anterior (RF-26).
      responses:
        '200':
          description: Versión del contrato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractVersion'
              examples:
                contractVersion:
                  $ref: '#/components/examples/ContractVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/operations:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Contracts]
      operationId: listOperations
      summary: Operaciones del proyecto
      description: |
        Operaciones del proyecto según la versión vigente del contrato (CU-08 paso 4). Una operación es
        estable entre versiones: se identifica por método y ruta normalizada. Orden: ruta y luego método.
        `page_size` acepta hasta 500.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: include_retired
          in: query
          required: false
          description: Incluir las operaciones que ya no aparecen en la versión vigente.
          schema:
            type: boolean
            default: false
        - name: method
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/HttpMethod'
      responses:
        '200':
          description: Página de operaciones. Vacía si aún no se ha importado un contrato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationPage'
              examples:
                operationPage:
                  $ref: '#/components/examples/OperationPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/operations/{operation_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/OperationId'
    patch:
      tags: [Policy]
      operationId: updateOperation
      summary: Política y parámetros de recurso de una operación
      description: |
        Confirma o cambia la plantilla de política (RF-39 a RF-41) y corrige los parámetros que
        identifican recursos (RF-35). Fijar `policy` es confirmarla: las propuestas sin confirmar no se
        usan en las pruebas (RN-08). `"policy": null` la vuelve a dejar sin confirmar. Guarda quién y
        cuándo la modificó (RF-43).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationUpdate'
            examples:
              ownerOnly:
                $ref: '#/components/examples/OperationUpdate'
      responses:
        '200':
          description: La operación con su política actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`operation.retired`: la operación ya no aparece en el contrato vigente.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            `validation.*`, `policy.owner_field_required` (plantilla de propiedad sin `owner_field`, CU-11
            E1) u `operation.unknown_parameter` (un parámetro de recurso que no es parámetro de ruta de la
            operación).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/policy:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Policy]
      operationId: applyPolicy
      summary: Aplicar una plantilla a varias operaciones
      description: |
        Edición en bloque (RF-42), por ejemplo todas las operaciones de una ruta. Todo o nada: si una
        operación no es válida, no cambia ninguna. Confirma la plantilla en todas (RN-08).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyBulkUpdate'
      responses:
        '200':
          description: Las operaciones actualizadas, ordenadas por ruta y método.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyBulkResult'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`operation.retired`: alguna operación ya no aparece en el contrato vigente.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            `validation.*`, `policy.owner_field_required` u `operation.not_found` (algún id no es una
            operación del proyecto; `errors[].field` es `operation_ids.N`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/identities:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Identities]
      operationId: listIdentities
      summary: Identidades del proyecto
      description: |
        Identidades no eliminadas. La anónima (RF-34) va primero; las demás, por fecha de creación.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de identidades.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityPage'
              examples:
                identityPage:
                  $ref: '#/components/examples/IdentityPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Identities]
      operationId: createIdentity
      summary: Registrar una identidad
      description: |
        CU-09. La credencial se cifra con AES-256-GCM antes de guardarse (RN-11, ADR-007) y nunca vuelve
        en una respuesta: solo `credential_suffix`. Se guarda sin probarla; la prueba es
        `POST …/identities/{identity_id}/test`. Hasta 20 identidades por proyecto, contando la anónima.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityCreate'
            examples:
              bearer:
                $ref: '#/components/examples/BearerIdentityCreate'
              login:
                $ref: '#/components/examples/LoginIdentityCreate'
      responses:
        '201':
          description: Identidad creada.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
              examples:
                identity:
                  $ref: '#/components/examples/Identity'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`identity.name_taken` (otra identidad del proyecto se llama igual) o `identity.limit_reached` (ya hay 20).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            `validation.*`, `identity.credential_mismatch` (la forma de `credential` no corresponde a
            `auth_type`), `identity.field_name_required` (`cookie` o `header` sin `field_name`),
            `identity.field_name_reserved` (una cabecera que la plataforma controla, como `Host`) o
            `identity.login_operation_required` (`login` sin `login_operation_id`, o con una operación
            que no existe o fue retirada).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/identities/{identity_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IdentityId'
    patch:
      tags: [Identities]
      operationId: updateIdentity
      summary: Editar una identidad
      description: |
        Cambios parciales. Una `credential` nueva reemplaza la anterior y vuelve a `status: active`.
        Cambiar `auth_type` exige enviar la `credential` de la nueva forma. La identidad anónima no se edita.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityUpdate'
      responses:
        '200':
          description: Identidad actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`identity.anonymous` (la identidad anónima no se edita) o `identity.name_taken`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            `validation.*`, `identity.credential_required` (cambia `auth_type` sin `credential`) y los
            mismos códigos que al crear.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Identities]
      operationId: deleteIdentity
      summary: Eliminar una identidad
      description: |
        Borrado lógico: la credencial se borra de inmediato y el nombre queda libre (ADR-015). Sus
        recursos se eliminan. Los hallazgos que la usan se conservan.
      responses:
        '204':
          description: Identidad eliminada.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`identity.anonymous` (la identidad anónima no se elimina, RF-34) o `project.active_run` (hay una ejecución en cola o en curso).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/identities/{identity_id}/test:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/IdentityId'
    post:
      tags: [Identities]
      operationId: testIdentity
      summary: Probar la credencial de una identidad
      description: |
        RF-32. Envía una petición GET, a través de la guardia SSRF, a una operación protegida con la
        credencial (en `login`, primero obtiene el token con la operación de login). Exige el proyecto
        verificado (RN-01). Sin `operation_id`, el sistema elige un GET vigente con seguridad declarada y
        sin parámetros de ruta. Responde 200 aunque la credencial falle: el resultado va en
        `succeeded`, con el código de estado recibido y nunca la credencial. Guarda `last_tested_at` y
        `last_test_status_code`. Síncrona: hasta 20 segundos.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityTestRequest'
      responses:
        '200':
          description: Resultado de la prueba.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityTest'
              examples:
                rejected:
                  $ref: '#/components/examples/RejectedIdentityTest'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`project.not_verified` (RN-01) o `identity.anonymous` (la anónima no tiene credencial que probar).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            `validation.*` u `identity.no_test_operation` (no hay un GET protegido sin parámetros de ruta,
            o el `operation_id` indicado no existe, está retirado o no es GET).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/resources:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Resources]
      operationId: listResources
      summary: Recursos por identidad
      description: Orden por tipo y luego por identificador (F-06).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: identity_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: resource_type
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
            pattern: '^[^\x00-\x1F\x7F]*$'
      responses:
        '200':
          description: Página de recursos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePage'
              examples:
                resourcePage:
                  $ref: '#/components/examples/ResourcePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Resources]
      operationId: createResource
      summary: Registrar un recurso a mano
      description: |
        RF-37. Queda con `source: manual` y `confirmed: true`. El descubrimiento automático (RF-36) es
        `discoverResources`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceCreate'
      responses:
        '201':
          description: Recurso creado.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`resource.owned_by_other`: ese tipo e identificador ya pertenecen a otra identidad (un objeto tiene un solo dueño).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            `validation.*`, `identity.not_found` (la identidad no es del proyecto o fue eliminada) o
            `resource.anonymous_owner` (la identidad anónima no tiene recursos).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/resources/discovery:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Resources]
      operationId: discoverResources
      summary: Descubrir recursos por identidad
      description: |
        RF-36. Llama como cada identidad, a través de la guardia SSRF, solo a las operaciones GET de
        listado del contrato vigente: sin parámetros de ruta y con una respuesta 2xx declarada como arreglo
        o como objeto con un arreglo. El tipo de recurso es el último segmento de la ruta (`/orders` →
        `orders`) y el identificador, el campo `id` de cada elemento.

        - Los recursos nuevos quedan con `source: discovered` y `confirmed: false` (CU-10 paso 3).
        - Los que la identidad ya tiene no cambian. Los que pertenecen a otra identidad se omiten, porque
          un objeto tiene un solo dueño.
        - La identidad anónima no participa. Una identidad con la credencial vencida se informa en
          `identities[].failure` y no detiene a las demás.

        Exige el proyecto verificado (RN-01) y sin ejecución activa (RN-07). Síncrona, con topes de 100
        peticiones y 25 segundos; si se alcanza uno, `truncated` es `true` y lo encontrado se guarda.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceDiscoveryRequest'
      responses:
        '200':
          description: Resultado del descubrimiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceDiscovery'
              examples:
                discovery:
                  $ref: '#/components/examples/ResourceDiscovery'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`project.not_verified` (RN-01) o `project.active_run` (RN-07).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            `validation.*`, `identity.not_found` (un id de `identity_ids` no es una identidad vigente del
            proyecto), `resource.anonymous_owner` (se pidió la identidad anónima) o
            `resource.no_list_operations` (el contrato vigente no tiene operaciones GET de listado).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/resources/{resource_id}:
