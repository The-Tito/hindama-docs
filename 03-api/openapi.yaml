          format: uuid
    patch:
      tags: [Resources]
      operationId: updateResource
      summary: Editar o confirmar un recurso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceUpdate'
      responses:
        '200':
          description: Recurso actualizado.
          content:
            application/json:
