openapi: 3.1.0
info:
  title: Hindama API
  version: 0.1.0
  summary: API privada de la plataforma Hindama. Su único cliente es el servidor de Next.js (BFF).
  description: |
    Contrato de la API de la plataforma. Es la fuente de verdad: el backend lo implementa y el
    frontend lo consume (ADR-016). Las reglas comunes (errores, paginación, nombres, cabeceras)
    están en `convenciones.md`, junto a este archivo.

    Alcance de la versión 0.1.0: endpoints de la semana 1, casos de uso CU-05 a CU-08 más `GET /yo`.
    Los textos para el usuario los elige el frontend según los campos `codigo` de errores y advertencias.
servers:
  - url: https://backend.interno:8443
    description: API privada, solo accesible desde la EC2 del frontend.
  - url: http://localhost:8000
    description: Desarrollo local.
security:
  - bearerAuth: []
tags:
  - name: Sistema
    description: Salud del servicio.
  - name: Cuenta
    description: Datos del usuario de la sesión (CU-02, CU-05).
  - name: Proyectos
    description: Gestión de proyectos (CU-05, CU-06).
  - name: Verificacion
    description: Verificación de propiedad de la API (CU-07).
  - name: Contratos
    description: Importación del contrato OpenAPI y sus operaciones (CU-08).

paths:
  /salud:
    get:
      tags: [Sistema]
      operationId: obtenerSalud
      summary: Estado del servicio
      description: Sin autenticación. Responde 200 si la API y la base de datos responden.
      security: []
      responses:
        '200':
          description: El servicio funciona.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
        '503':
          $ref: '#/components/responses/NoDisponible'

  /yo:
    get:
      tags: [Cuenta]
      operationId: obtenerYo
      summary: Usuario de la sesión
      description: |
        Datos del usuario autenticado. En su primer acceso, el usuario se da de alta en la plataforma.
        Next.js usa `rol` solo para elegir la pantalla inicial; toda autorización la decide la API.
      responses:
        '200':
          description: Usuario de la sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Yo'
              examples:
                yo:
                  $ref: '#/components/examples/Yo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /yo/terminos:
    post:
      tags: [Cuenta]
      operationId: aceptarTerminos
      summary: Aceptar los términos de uso responsable
      description: Registra la fecha y la versión aceptada (RF-16, RN-12). Aceptar la misma versión otra vez no cambia nada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AceptacionTerminos'
      responses:
        '200':
          description: Términos aceptados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Yo'
              examples:
                yo:
                  $ref: '#/components/examples/Yo'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          description: |
            `terminos.version_obsoleta`: la versión enviada no es la vigente; volver a mostrar los términos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /proyectos:
    get:
      tags: [Proyectos]
      operationId: listarProyectos
      summary: Proyectos del analista
      description: Solo los proyectos del usuario de la sesión (RF-12, RN-02). Orden por defecto `-creado_en`.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
        - name: orden
          in: query
          required: false
          schema:
            type: string
            enum: [creado_en, -creado_en, nombre, -nombre, ultima_ejecucion_en, -ultima_ejecucion_en]
            default: -creado_en
      responses:
        '200':
          description: Página de proyectos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaProyectos'
              examples:
                paginaProyectos:
                  $ref: '#/components/examples/PaginaProyectos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolNoPermitido'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
    post:
      tags: [Proyectos]
      operationId: crearProyecto
      summary: Crear un proyecto
      description: |
        Crea el proyecto en estado `pendiente` con su código de verificación y su identidad anónima (CU-05).
        Exige haber aceptado los términos vigentes (RN-12).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProyectoCrear'
      responses:
        '201':
          description: Proyecto creado. Puede traer advertencias `url.sin_tls` o `url.no_resuelve`.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proyecto'
              examples:
                proyecto:
                  $ref: '#/components/examples/Proyecto'
                proyectoNuevoHttp:
                  $ref: '#/components/examples/ProyectoNuevoHttp'
        '400':
          $ref: '#/components/responses/MalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: |
            `terminos.no_aceptados`: mostrar los términos y llamar a `aceptarTerminos` antes de reintentar.
            `rol.no_permitido`: el administrador no crea proyectos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                terminosNoAceptados:
                  $ref: '#/components/examples/TerminosNoAceptados'
        '422':
          description: |
            Errores de campo (`validacion.*`) o de la URL base: `url.formato_invalido`,
            `url.esquema_no_permitido`, `url.destino_no_permitido` (RF-11).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                urlNoPermitida:
                  $ref: '#/components/examples/UrlNoPermitida'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /proyectos/{proyecto_id}:
    parameters:
      - $ref: '#/components/parameters/ProyectoId'
    get:
      tags: [Proyectos]
      operationId: obtenerProyecto
      summary: Dashboard del proyecto
      description: Estado de verificación, contrato vigente, módulos disponibles, última ejecución y hallazgos abiertos por severidad (RF-15).
      responses:
        '200':
          description: Proyecto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proyecto'
              examples:
                proyecto:
                  $ref: '#/components/examples/Proyecto'
                proyectoNuevoHttp:
                  $ref: '#/components/examples/ProyectoNuevoHttp'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolNoPermitido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
    patch:
      tags: [Proyectos]
      operationId: editarProyecto
      summary: Editar nombre, descripción o URL base
      description: |
        Si cambia el host de la URL base, el proyecto vuelve a `pendiente` y la respuesta trae la
        advertencia `proyecto.verificacion_perdida` (RF-13).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProyectoEditar'
      responses:
        '200':
          description: Proyecto actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proyecto'
              examples:
                proyecto:
                  $ref: '#/components/examples/Proyecto'
                proyectoNuevoHttp:
                  $ref: '#/components/examples/ProyectoNuevoHttp'
        '400':
          $ref: '#/components/responses/MalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolNoPermitido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          description: Errores de campo o de la URL base, igual que en `crearProyecto`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
    delete:
      tags: [Proyectos]
      operationId: eliminarProyecto
      summary: Eliminar un proyecto
      description: Borra el proyecto y todo su contenido de forma permanente (RF-14).
      parameters:
        - name: confirmacion
          in: query
          required: true
          description: Nombre exacto del proyecto, tal como lo escribió el analista.
          schema:
            type: string
            maxLength: 100
      responses:
        '204':
          description: Proyecto eliminado.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolNoPermitido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          description: '`proyecto.ejecucion_activa`: hay una ejecución en cola o en curso; cancelarla primero (CU-06 E2).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          description: '`proyecto.confirmacion_incorrecta`: el nombre no coincide.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /proyectos/{proyecto_id}/verificacion:
    parameters:
      - $ref: '#/components/parameters/ProyectoId'
    get:
      tags: [Verificacion]
      operationId: obtenerVerificacion
      summary: Instrucciones y estado de la verificación
      description: Código del proyecto y cómo publicarlo con cada método (CU-07 paso 2).
      responses:
        '200':
          description: Verificación del proyecto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verificacion'
              examples:
                verificacionPendiente:
                  $ref: '#/components/examples/VerificacionPendiente'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolNoPermitido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
    post:
      tags: [Verificacion]
      operationId: verificarPropiedad
      summary: Comprobar la propiedad
      description: |
        Consulta el archivo `/.well-known/hindama-verificacion.txt` o el registro TXT
        `_hindama-verificacion.<host>` a través de la guardia SSRF (ADR-008). Es síncrona y puede tardar
        hasta 20 segundos. Verificar un proyecto ya verificado vuelve a comprobarlo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificacionSolicitud'
      responses:
        '200':
          description: El código coincide; el proyecto queda `verificado`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verificacion'
              examples:
                verificacionPendiente:
                  $ref: '#/components/examples/VerificacionPendiente'
        '400':
          $ref: '#/components/responses/MalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolNoPermitido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          description: |
            La verificación falló (RF-21). `codigo`: `verificacion.archivo_no_encontrado`,
            `verificacion.contenido_distinto`, `verificacion.txt_ausente`, `verificacion.error_conexion`
            o `verificacion.destino_no_permitido`. El campo `encontrado` resume lo que se obtuvo. El
            proyecto queda `pendiente`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemaVerificacion'
              examples:
                verificacionFallida:
                  $ref: '#/components/examples/VerificacionFallida'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /proyectos/{proyecto_id}/contratos:
    parameters:
      - $ref: '#/components/parameters/ProyectoId'
    get:
      tags: [Contratos]
      operationId: listarContratos
      summary: Versiones del contrato
      description: Todas las versiones importadas (RF-26). Orden por defecto `-numero` (la más reciente primero).
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamano'
      responses:
        '200':
          description: Página de versiones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaContratos'
              examples:
                paginaContratos:
                  $ref: '#/components/examples/PaginaContratos'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolNoPermitido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'
    post:
      tags: [Contratos]
      operationId: importarContrato
      summary: Importar una versión del contrato
      description: |
        Envía **exactamente uno** de `archivo` o `url` (CU-08). Acepta OpenAPI 3.0 y 3.1 en JSON o YAML,
        hasta 5 MB (RF-22). Resuelve solo referencias internas (RF-23). La importación por URL pasa por la
        guardia SSRF y se permite antes de verificar el proyecto (excepción de RN-01). Es síncrona: hasta
        10 segundos de análisis más hasta 20 de descarga.

        Si el documento es idéntico a la versión vigente, no se crea otra: responde `200` con la versión
        vigente y la advertencia `contrato.sin_cambios`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContratoImportar'
            encoding:
              archivo:
                contentType: application/json, application/yaml, application/x-yaml, text/yaml, text/plain, application/octet-stream
      responses:
        '201':
          description: Nueva versión creada.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionContrato'
              examples:
                versionContrato:
                  $ref: '#/components/examples/VersionContrato'
        '200':
          description: El documento es idéntico a la versión vigente; trae la advertencia `contrato.sin_cambios`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionContrato'
              examples:
                versionContrato:
                  $ref: '#/components/examples/VersionContrato'
        '400':
          $ref: '#/components/responses/MalFormada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolNoPermitido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '413':
          description: '`contrato.demasiado_grande`: más de 5 MB.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '422':
          description: |
            `contrato.origen_requerido`, `contrato.invalido` (con `errores[]`: el `campo` es la ubicación en
            el documento, JSON Pointer o «línea N»), `contrato.version_no_soportada`,
            `contrato.url_inaccesible` o `contrato.url_no_permitida`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              examples:
                contratoInvalido:
                  $ref: '#/components/examples/ContratoInvalido'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /proyectos/{proyecto_id}/contratos/{contrato_id}:
    parameters:
      - $ref: '#/components/parameters/ProyectoId'
      - name: contrato_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Contratos]
      operationId: obtenerContrato
      summary: Una versión del contrato
      description: Avisos de la importación y diferencias con la versión anterior (RF-26).
      responses:
        '200':
          description: Versión del contrato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionContrato'
              examples:
                versionContrato:
                  $ref: '#/components/examples/VersionContrato'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolNoPermitido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

  /proyectos/{proyecto_id}/operaciones:
    parameters:
      - $ref: '#/components/parameters/ProyectoId'
    get:
      tags: [Contratos]
      operationId: listarOperaciones
      summary: Operaciones del proyecto
      description: |
        Operaciones del proyecto según la versión vigente del contrato (CU-08 paso 4). Una operación es
        estable entre versiones: se identifica por método y ruta normalizada. Orden: ruta y luego método.
        `tamano` acepta hasta 500.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - name: tamano
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: incluir_retiradas
          in: query
          required: false
          description: Incluir las operaciones que ya no aparecen en la versión vigente.
          schema:
            type: boolean
            default: false
        - name: metodo
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MetodoHttp'
      responses:
        '200':
          description: Página de operaciones. Vacía si aún no se ha importado un contrato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaOperaciones'
              examples:
                paginaOperaciones:
                  $ref: '#/components/examples/PaginaOperaciones'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/RolNoPermitido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '429':
          $ref: '#/components/responses/DemasiadasPeticiones'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de Amazon Cognito. Lo agrega el servidor de Next.js; el navegador nunca lo ve.

  parameters:
    ProyectoId:
      name: proyecto_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Pagina:
      name: pagina
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Tamano:
      name: tamano
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    Location:
      description: Ruta del recurso creado.
      schema:
        type: string
    RetryAfter:
      description: Segundos que hay que esperar antes de reintentar.
      schema:
        type: integer
    WwwAuthenticate:
      schema:
        type: string
        example: Bearer

  responses:
    MalFormada:
      description: '`peticion.mal_formada`: cuerpo ilegible o tipo de contenido incorrecto.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoAutenticado:
      description: '`autenticacion.requerida` o `autenticacion.token_invalido`. Next.js debe renovar el token o cerrar la sesión.'
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    RolNoPermitido:
      description: '`rol.no_permitido`: el administrador no accede al contenido de los proyectos (RF-80).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoEncontrado:
      description: '`recurso.no_encontrado`: no existe o pertenece a otro analista; las dos respuestas son idénticas (RN-02, RNF-05).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    DemasiadasPeticiones:
      description: '`limite.peticiones`: más de 100 peticiones por minuto (RNF-09).'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NoDisponible:
      description: '`servicio.no_disponible`: una dependencia no responde.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'

  examples:
    Yo:
      summary: Analista que aún no acepta los términos
      value:
        id: 0192e3a0-1111-7000-8000-000000000001
        nombre: Ana López
        correo: ana@ejemplo.com
        rol: analista
        terminos:
          version_vigente: '2026-10-30'
          version_aceptada: null
          aceptados_en: null
          requiere_aceptar: true
    PaginaProyectos:
      summary: Dos proyectos
      value:
        elementos:
          - id: 0192e3a0-2222-7000-8000-000000000001
            nombre: API de pedidos
            url_base: https://api.tienda-ejemplo.com/v1
            estado_verificacion: verificado
            concluido: false
            ultima_ejecucion_en: '2026-11-03T17:42:10Z'
            hallazgos_abiertos: 5
            creado_en: '2026-11-02T15:00:00Z'
          - id: 0192e3a0-2222-7000-8000-000000000002
            nombre: API interna de inventario
            url_base: http://inventario.ejemplo.mx
            estado_verificacion: pendiente
            concluido: false
            ultima_ejecucion_en: null
            hallazgos_abiertos: 0
            creado_en: '2026-11-04T09:30:00Z'
        total: 2
        pagina: 1
        tamano: 20
    Proyecto:
      summary: Proyecto verificado con una ejecución
      value:
        id: 0192e3a0-2222-7000-8000-000000000001
        nombre: API de pedidos
        descripcion: API pública de la tienda, entorno de staging.
        url_base: https://api.tienda-ejemplo.com/v1
        host: api.tienda-ejemplo.com
        estado_verificacion: verificado
        verificado_en: '2026-11-02T15:20:00Z'
        concluido: false
        contrato_vigente:
          id: 0192e3a0-3333-7000-8000-000000000002
          numero: 2
          origen: url
          version_openapi: 3.0.3
          total_operaciones: 18
          importado_en: '2026-11-03T10:05:00Z'
        ultima_ejecucion:
          id: 0192e3a0-4444-7000-8000-000000000001
