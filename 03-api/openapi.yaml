openapi: 3.1.0
info:
  title: Hindama API
  version: 0.2.0
  summary: API privada de la plataforma Hindama. Su único cliente es el servidor de Next.js (BFF).
  description: |
    Contrato de la API de la plataforma. Es la fuente de verdad: el backend lo implementa y el
    frontend lo consume (ADR-016). Las reglas comunes (errores, paginación, nombres, cabeceras)
    están en `convenciones.md`; la traducción de cada término del dominio, en `glosario-identificadores.md`.

    Alcance de la versión 0.2.0: endpoints de la semana 1, casos de uso CU-05 a CU-08 más `GET /me`.
    Los identificadores están en inglés (ADR-017). Los textos para el usuario los elige el frontend
    según el campo `code` de errores y advertencias.
servers:
  - url: https://backend.internal:8443
    description: API privada, solo accesible desde la EC2 del frontend.
  - url: http://localhost:8000
    description: Desarrollo local.
security:
  - bearerAuth: []
tags:
  - name: System
    description: Salud del servicio.
  - name: Account
    description: Datos del usuario de la sesión (CU-02, CU-05).
  - name: Projects
    description: Gestión de proyectos (CU-05, CU-06).
  - name: Verification
    description: Verificación de propiedad de la API (CU-07).
  - name: Contracts
    description: Importación del contrato OpenAPI y sus operaciones (CU-08).

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Estado del servicio
      description: Sin autenticación. Responde 200 si la API y la base de datos responden.
      security: []
      responses:
        '200':
          description: El servicio funciona.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/Unavailable'

  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Usuario de la sesión
      description: |
        Datos del usuario autenticado. En su primer acceso, el usuario se da de alta en la plataforma.
        Next.js usa `role` solo para elegir la pantalla inicial; toda autorización la decide la API.
      responses:
        '200':
          description: Usuario de la sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                me:
                  $ref: '#/components/examples/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /me/terms:
    post:
      tags: [Account]
      operationId: acceptTerms
      summary: Aceptar los términos de uso responsable
      description: Registra la fecha y la versión aceptada (RF-16, RN-12). Aceptar la misma versión otra vez no cambia nada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TermsAcceptance'
      responses:
        '200':
          description: Términos aceptados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                me:
                  $ref: '#/components/examples/Me'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: '`terms.outdated_version`: la versión enviada no es la vigente; volver a mostrar los términos.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: Proyectos del analista
      description: Solo los proyectos del usuario de la sesión (RF-12, RN-02). Orden por defecto `-created_at`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [created_at, -created_at, name, -name, last_run_at, -last_run_at]
            default: -created_at
      responses:
        '200':
          description: Página de proyectos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
              examples:
                projectPage:
                  $ref: '#/components/examples/ProjectPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Crear un proyecto
      description: |
        Crea el proyecto en estado `pending` con su código de verificación y su identidad anónima (CU-05).
        Exige haber aceptado los términos vigentes (RN-12).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Proyecto creado. Puede traer las advertencias `url.no_tls` o `url.unresolved`.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                newHttpProject:
                  $ref: '#/components/examples/NewHttpProject'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            `terms.not_accepted`: mostrar los términos y llamar a `acceptTerms` antes de reintentar.
            `role.forbidden`: el administrador no crea proyectos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                termsNotAccepted:
                  $ref: '#/components/examples/TermsNotAccepted'
        '422':
          description: |
            Errores de campo (`validation.*`) o de la URL base: `url.invalid_format`,
            `url.scheme_not_allowed`, `url.destination_not_allowed` (RF-11).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                urlNotAllowed:
                  $ref: '#/components/examples/UrlNotAllowed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Dashboard del proyecto
      description: Estado de verificación, contrato vigente, módulos disponibles, última ejecución y hallazgos abiertos por severidad (RF-15).
      responses:
        '200':
          description: Proyecto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                project:
                  $ref: '#/components/examples/Project'
                newHttpProject:
                  $ref: '#/components/examples/NewHttpProject'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Editar nombre, descripción o URL base
      description: |
        Si cambia el host de la URL base, el proyecto vuelve a `pending` y la respuesta trae la
        advertencia `project.verification_lost` (RF-13).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Proyecto actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              examples:
                project:
                  $ref: '#/components/examples/Project'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Errores de campo o de la URL base, igual que en `createProject`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Eliminar un proyecto
      description: Borra el proyecto y todo su contenido de forma permanente (RF-14).
      parameters:
        - name: confirmation
          in: query
          required: true
          description: Nombre exacto del proyecto, tal como lo escribió el analista.
          schema:
            type: string
            maxLength: 100
      responses:
        '204':
          description: Proyecto eliminado.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`project.active_run`: hay una ejecución en cola o en curso; cancelarla primero (CU-06 E2).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`project.confirmation_mismatch`: el nombre no coincide.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/verification:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Verification]
      operationId: getVerification
      summary: Instrucciones y estado de la verificación
      description: Código del proyecto y cómo publicarlo con cada método (CU-07 paso 2).
      responses:
        '200':
          description: Verificación del proyecto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
              examples:
                pendingVerification:
                  $ref: '#/components/examples/PendingVerification'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Verification]
      operationId: verifyOwnership
      summary: Comprobar la propiedad
      description: |
        Consulta el archivo `/.well-known/hindama-verificacion.txt` o el registro TXT
        `_hindama-verificacion.<host>` a través de la guardia SSRF (ADR-008). Es síncrona y puede tardar
        hasta 20 segundos. Verificar un proyecto ya verificado vuelve a comprobarlo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          description: El código coincide; el proyecto queda `verified`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            La verificación falló (RF-21). `code`: `verification.file_not_found`,
            `verification.content_mismatch`, `verification.txt_missing`, `verification.connection_error`
            o `verification.destination_not_allowed`. El campo `found` resume lo que se obtuvo. El
            proyecto queda `pending`. También puede ser un error de campo (`validation.*`), con el
            esquema `Problem`.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/VerificationProblem'
                  - $ref: '#/components/schemas/Problem'
              examples:
                failedVerification:
                  $ref: '#/components/examples/FailedVerification'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/contracts:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Contracts]
      operationId: listContracts
      summary: Versiones del contrato
      description: Todas las versiones importadas (RF-26). Orden por defecto `-number` (la más reciente primero).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página de versiones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPage'
              examples:
                contractPage:
                  $ref: '#/components/examples/ContractPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Contracts]
      operationId: importContract
      summary: Importar una versión del contrato
      description: |
        Envía **exactamente uno** de `file` o `url` (CU-08). Acepta OpenAPI 3.0 y 3.1 en JSON o YAML,
        hasta 5 MB (RF-22). Resuelve solo referencias internas (RF-23). La importación por URL pasa por la
        guardia SSRF y se permite antes de verificar el proyecto (excepción de RN-01). Es síncrona: hasta
        10 segundos de análisis más hasta 20 de descarga.

        Si el documento es idéntico a la versión vigente, no se crea otra: responde `200` con la versión
        vigente y la advertencia `contract.unchanged`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContractImport'
            encoding:
              file:
                contentType: application/json, application/yaml, application/x-yaml, text/yaml, text/plain, application/octet-stream
      responses:
        '201':
          description: Nueva versión creada.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractVersion'
              examples:
                contractVersion:
                  $ref: '#/components/examples/ContractVersion'
        '200':
          description: El documento es idéntico a la versión vigente; trae la advertencia `contract.unchanged`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractVersion'
        '400':
          $ref: '#/components/responses/Malformed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: '`contract.too_large`: más de 5 MB.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            `contract.source_required`, `contract.invalid` (con `errors[]`: el `field` es la ubicación en
            el documento, JSON Pointer o «línea N»), `contract.unsupported_version`,
            `contract.url_unreachable` o `contract.url_not_allowed`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidContract:
                  $ref: '#/components/examples/InvalidContract'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/contracts/{contract_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: contract_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Contracts]
      operationId: getContract
      summary: Una versión del contrato
      description: Avisos de la importación y diferencias con la versión anterior (RF-26).
      responses:
        '200':
          description: Versión del contrato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractVersion'
              examples:
                contractVersion:
                  $ref: '#/components/examples/ContractVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /projects/{project_id}/operations:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Contracts]
      operationId: listOperations
      summary: Operaciones del proyecto
      description: |
        Operaciones del proyecto según la versión vigente del contrato (CU-08 paso 4). Una operación es
        estable entre versiones: se identifica por método y ruta normalizada. Orden: ruta y luego método.
        `page_size` acepta hasta 500.
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: include_retired
          in: query
          required: false
          description: Incluir las operaciones que ya no aparecen en la versión vigente.
          schema:
            type: boolean
            default: false
        - name: method
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/HttpMethod'
      responses:
        '200':
          description: Página de operaciones. Vacía si aún no se ha importado un contrato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationPage'
              examples:
                operationPage:
                  $ref: '#/components/examples/OperationPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/RoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de Amazon Cognito. Lo agrega el servidor de Next.js; el navegador nunca lo ve.

  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    Location:
      description: Ruta del recurso creado.
      schema:
        type: string
    RetryAfter:
      description: Segundos que hay que esperar antes de reintentar.
      schema:
        type: integer
    WwwAuthenticate:
      schema:
        type: string
        example: Bearer

  responses:
    Malformed:
      description: '`request.malformed`: cuerpo ilegible o tipo de contenido incorrecto.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: '`validation.*`: un parámetro de la ruta o de la consulta no es válido (por ejemplo, un UUID mal formado).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: '`auth.required` o `auth.invalid_token`. Next.js debe renovar el token o cerrar la sesión.'
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RoleForbidden:
      description: '`role.forbidden`: el administrador no accede al contenido de los proyectos (RF-80).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: '`resource.not_found`: no existe o pertenece a otro analista; las dos respuestas son idénticas (RN-02, RNF-05).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: '`rate_limit.exceeded`: más de 100 peticiones por minuto (RNF-09).'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: '`service.unavailable`: una dependencia no responde.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  examples:
    Me:
      summary: Analista que aún no acepta los términos
      value:
        id: 0192e3a0-1111-7000-8000-000000000001
        name: Ana López
        email: ana@ejemplo.com
        role: analyst
        terms:
          current_version: '2026-10-30'
          accepted_version: null
          accepted_at: null
          acceptance_required: true
    ProjectPage:
      summary: Dos proyectos
      value:
        items:
          - id: 0192e3a0-2222-7000-8000-000000000001
            name: API de pedidos
            base_url: https://api.tienda-ejemplo.com/v1
            verification_status: verified
            concluded: false
            last_run_at: '2026-11-03T17:42:10Z'
            open_findings: 5
            created_at: '2026-11-02T15:00:00Z'
          - id: 0192e3a0-2222-7000-8000-000000000002
            name: API interna de inventario
            base_url: http://inventario.ejemplo.mx
            verification_status: pending
            concluded: false
            last_run_at: null
            open_findings: 0
            created_at: '2026-11-04T09:30:00Z'
        total: 2
        page: 1
        page_size: 20
    Project:
      summary: Proyecto verificado con una ejecución
      value:
        id: 0192e3a0-2222-7000-8000-000000000001
        name: API de pedidos
        description: API pública de la tienda, entorno de staging.
        base_url: https://api.tienda-ejemplo.com/v1
        host: api.tienda-ejemplo.com
        verification_status: verified
        verified_at: '2026-11-02T15:20:00Z'
        concluded: false
        current_contract:
          id: 0192e3a0-3333-7000-8000-000000000002
          number: 2
          source: url
          openapi_version: 3.0.3
          operation_count: 18
          imported_at: '2026-11-03T10:05:00Z'
        last_run:
          id: 0192e3a0-4444-7000-8000-000000000001
          number: 1
          status: completed
          created_at: '2026-11-03T17:30:00Z'
          finished_at: '2026-11-03T17:42:10Z'
        open_findings_by_severity:
          critical: 1
          high: 2
          medium: 1
          low: 1
          info: 0
          total: 5
        modules:
          - module: authentication
            risk: low
            available: true
            missing: []
          - module: configuration
            risk: low
            available: true
            missing: []
          - module: object_access
            risk: low
            available: false
            missing: [insufficient_identities, no_resources]
          - module: function_access
            risk: low
            available: false
            missing: [no_admin_identity, policy_unconfirmed]
          - module: property_access
            risk: medium
            available: true
            missing: []
          - module: resource_consumption
            risk: high
            available: true
            missing: []
          - module: sql_injection
            risk: high
            available: true
            missing: []
        warnings: []
        created_at: '2026-11-02T15:00:00Z'
        updated_at: '2026-11-03T10:05:00Z'
    NewHttpProject:
      summary: Proyecto recién creado con URL HTTP
