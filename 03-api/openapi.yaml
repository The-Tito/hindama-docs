  schemas:
    # ---------- Common ----------
    Problem:
      type: object
      additionalProperties: false
      description: Error en formato Problem Details (RFC 9457) con las extensiones de Hindama. Ver convenciones, sección 8.
      required: [type, title, status, detail, code, request_id, errors]
      properties:
        type:
          type: string
          description: '`urn:hindama:error:<code>`.'
          examples: ['urn:hindama:error:url.destination_not_allowed']
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Texto en español de respaldo. El frontend debe preferir su propio texto según `code`.
        code:
          type: string
          description: Código estable del error. Es el valor que el cliente debe interpretar.
          examples: ['url.destination_not_allowed']
        request_id:
          type: string
          description: Mismo valor que la cabecera `X-Request-Id`.
        errors:
          type: array
          description: Errores por campo. Vacío si el error no es de un campo.
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: [string, 'null']
          description: Ruta del campo con puntos, nombre del parámetro o ubicación en un documento importado.
        code:
          type: string
        message:
          type: string
    VerificationProblem:
      type: object
      additionalProperties: false
      description: '`Problem` con el campo `found`.'
      required: [type, title, status, detail, code, request_id, errors, found]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum:
            - verification.file_not_found
            - verification.content_mismatch
            - verification.txt_missing
            - verification.connection_error
            - verification.destination_not_allowed
        request_id:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        found:
          type: [string, 'null']
          maxLength: 200
          description: |
            Resumen de lo obtenido, como texto no confiable: código HTTP, inicio del contenido del
            archivo o registros TXT encontrados. Mostrar siempre escapado.
    Warning:
      type: object
      additionalProperties: false
      required: [code, message, location]
      properties:
        code:
          type: string
          examples: ['url.no_tls']
        message:
          type: string
          description: Texto en español de respaldo.
        location:
          type: [string, 'null']
          description: En avisos del contrato, JSON Pointer dentro del documento; si no, `null`.
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    # ---------- Catalogs ----------
    Role:
      type: string
      enum: [analyst, admin]
    VerificationStatus:
      type: string
      enum: [pending, verified]
    VerificationMethod:
      type: string
      enum: [file, dns]
    HttpMethod:
      type: string
      enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, TRACE]
    Module:
      type: string
      description: Los siete módulos de prueba (F-09).
      enum: [authentication, configuration, object_access, function_access, property_access, resource_consumption, sql_injection]
    RunStatus:
      type: string
      enum: [queued, running, completed, cancelled, failed]

    # ---------- Account ----------
    Me:
      type: object
      additionalProperties: false
      required: [id, name, email, role, terms]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Nombre registrado en Cognito; no se guarda en la base de datos.
        email:
          type: string
          format: email
          description: Correo registrado en Cognito; no se guarda en la base de datos.
        role:
          $ref: '#/components/schemas/Role'
        terms:
          $ref: '#/components/schemas/TermsStatus'
    TermsStatus:
      type: object
      additionalProperties: false
      required: [current_version, accepted_version, accepted_at, acceptance_required]
      properties:
        current_version:
          type: string
          description: Versión de los términos que hay que aceptar. El texto lo publica el frontend.
          examples: ['2026-10-30']
        accepted_version:
          type: [string, 'null']
        accepted_at:
          type: [string, 'null']
          format: date-time
        acceptance_required:
          type: boolean
          description: '`true` si el usuario no ha aceptado la versión vigente; en ese caso no puede crear proyectos.'
    TermsAcceptance:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          type: string
          description: Debe ser igual a `current_version`.

    # ---------- Projects ----------
    ProjectCreate:
      type: object
      required: [name, base_url]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Se recortan los espacios de los extremos.
        description:
          type: [string, 'null']
          maxLength: 500
        base_url:
          type: string
          format: uri
          maxLength: 2048
          description: |
            URL base de la API, con esquema `http` o `https`, sin usuario, contraseña ni fragmento. Puede
            incluir puerto y ruta (`https://api.ejemplo.com/v1`). Se rechaza si el host es, o resuelve a, una
            dirección privada, de loopback, de enlace local o de metadatos (RF-11).
          examples: ['https://api.ejemplo.com/v1']
    ProjectUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 500
        base_url:
          type: string
          format: uri
          maxLength: 2048
    ProjectSummary:
      type: object
      additionalProperties: false
      description: Fila de la lista de proyectos (RF-12).
      required: [id, name, base_url, verification_status, concluded, last_run_at, open_findings, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        base_url:
          type: string
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
        concluded:
          type: boolean
          description: Al menos una ejecución completada y ningún hallazgo abierto (RN-10). Es independiente de la verificación.
        last_run_at:
          type: [string, 'null']
          format: date-time
        open_findings:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
    Project:
      type: object
      additionalProperties: false
      description: Dashboard del proyecto (RF-15).
      required:
        - id
        - name
        - description
        - base_url
        - host
        - verification_status
        - verified_at
        - concluded
        - current_contract
        - last_run
        - open_findings_by_severity
        - modules
        - warnings
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        base_url:
          type: string
        host:
          type: string
          description: Host exacto que se verifica (sin puerto ni ruta).
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
        verified_at:
          type: [string, 'null']
          format: date-time
        concluded:
          type: boolean
        current_contract:
          oneOf:
            - $ref: '#/components/schemas/ContractVersionSummary'
            - type: 'null'
        last_run:
          oneOf:
            - $ref: '#/components/schemas/RunSummary'
            - type: 'null'
        open_findings_by_severity:
          $ref: '#/components/schemas/SeverityCount'
        modules:
          type: array
          description: Los siete módulos con su disponibilidad (RF-45). Siempre en el orden del catálogo.
          items:
            $ref: '#/components/schemas/ModuleAvailability'
        warnings:
          type: array
          description: |
            Persistentes: aparecen en toda respuesta mientras la condición siga (`url.no_tls`).
            Momentáneas: solo en la respuesta de la operación que las causó (`project.verification_lost`
            en `updateProject`, `url.unresolved` en `createProject` y `updateProject`).
          items:
            $ref: '#/components/schemas/Warning'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SeverityCount:
      type: object
      additionalProperties: false
      description: Hallazgos abiertos (new, persistent o regression) por severidad.
      required: [critical, high, medium, low, info, total]
      properties:
        critical:
          type: integer
          minimum: 0
        high:
          type: integer
          minimum: 0
        medium:
          type: integer
          minimum: 0
        low:
          type: integer
          minimum: 0
        info:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    ModuleAvailability:
      type: object
      additionalProperties: false
      required: [module, risk, available, missing]
      properties:
        module:
          $ref: '#/components/schemas/Module'
        risk:
          type: string
          enum: [low, medium, high]
          description: Los de riesgo medio y alto exigen confirmación en cada ejecución (RN-05).
        available:
          type: boolean
        missing:
          type: array
          description: Requisitos que faltan (RF-45); vacío si `available` es `true`.
          items:
            type: string
            enum:
              - project_not_verified
              - no_contract
              - insufficient_identities
              - no_admin_identity
              - no_resources
              - policy_unconfirmed
    RunSummary:
      type: object
      additionalProperties: false
      description: Resumen de una ejecución. El recurso completo se define en la semana 2.
      required: [id, number, status, created_at, finished_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/RunStatus'
        created_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
    ProjectPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1

    # ---------- Verification ----------
    VerificationRequest:
      type: object
      required: [method]
      additionalProperties: false
      properties:
        method:
          $ref: '#/components/schemas/VerificationMethod'
    Verification:
      type: object
      additionalProperties: false
      required: [status, host, code, method, verified_at, file, dns]
      properties:
        status:
          $ref: '#/components/schemas/VerificationStatus'
        host:
          type: string
        code:
          type: string
          description: Código del proyecto que hay que publicar (RF-17).
        method:
          description: Método con el que se verificó; `null` si está pendiente.
          oneOf:
            - $ref: '#/components/schemas/VerificationMethod'
            - type: 'null'
        verified_at:
          type: [string, 'null']
          format: date-time
        file:
          type: object
          additionalProperties: false
          description: Instrucciones del método por archivo.
          required: [url, content]
          properties:
            url:
              type: string
              examples: ['https://api.ejemplo.com/.well-known/hindama-verificacion.txt']
            content:
              type: string
              description: Contenido exacto del archivo (el código).
        dns:
          type: object
          additionalProperties: false
          description: Instrucciones del método por registro TXT.
          required: [name, type, value]
          properties:
            name:
              type: string
              examples: ['_hindama-verificacion.api.ejemplo.com']
            type:
              type: string
              enum: [TXT]
            value:
              type: string

    # ---------- Contracts ----------
    ContractImport:
      type: object
      additionalProperties: false
      description: Exactamente uno de `file` o `url`.
      properties:
        file:
          type: string
          format: binary
          description: Documento OpenAPI 3.0 o 3.1 en JSON o YAML, hasta 5 MB.
        url:
          type: string
          format: uri
          maxLength: 2048
          description: URL pública del documento. Puede estar en un host distinto al de la API.
    ContractVersionSummary:
      type: object
      additionalProperties: false
      required: [id, number, source, openapi_version, operation_count, imported_at]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        source:
          type: string
          enum: [file, url]
        openapi_version:
          type: string
          examples: ['3.1.0']
        operation_count:
          type: integer
          minimum: 0
        imported_at:
          type: string
          format: date-time
    ContractVersion:
      type: object
      additionalProperties: false
      required: [id, number, source, openapi_version, operation_count, imported_at, source_url, file_name, format, api_title, sha256, is_current, warnings, changes]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
        source:
          type: string
          enum: [file, url]
        openapi_version:
          type: string
        operation_count:
          type: integer
          minimum: 0
        imported_at:
          type: string
          format: date-time
        source_url:
          type: [string, 'null']
        file_name:
          type: [string, 'null']
        format:
          type: string
          enum: [json, yaml]
        api_title:
          type: [string, 'null']
          description: '`info.title` del documento. Texto no confiable.'
        sha256:
          type: string
        is_current:
          type: boolean
          description: '`true` si es la versión más reciente.'
        warnings:
          type: array
          description: Lo que no se pudo interpretar, referencias externas no seguidas y servidores distintos a la URL base (RF-23, RF-27).
          items:
            $ref: '#/components/schemas/Warning'
        changes:
          description: Cambios respecto a la versión anterior (RF-26); `null` en la primera versión.
          oneOf:
            - $ref: '#/components/schemas/ContractChanges'
            - type: 'null'
    ContractChanges:
      type: object
      additionalProperties: false
      required: [previous_version, added, modified, removed]
      properties:
        previous_version:
          type: integer
          description: '`number` de la versión con la que se compara.'
        added:
          type: array
          items:
            $ref: '#/components/schemas/OperationRef'
        modified:
          type: array
          items:
            $ref: '#/components/schemas/OperationRef'
        removed:
          type: array
          items:
            $ref: '#/components/schemas/OperationRef'
    OperationRef:
      type: object
      additionalProperties: false
      required: [id, method, path]
      properties:
        id:
          type: string
          format: uuid
        method:
          $ref: '#/components/schemas/HttpMethod'
        path:
          type: string
    ContractPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContractVersionSummary'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1

    # ---------- Operations ----------
    Operation:
      type: object
      additionalProperties: false
      description: Operación del proyecto, estable entre versiones del contrato. Los textos vienen del contrato y no son confiables.
      required: [id, method, path, operation_id, summary, tags, parameters, body, security, retired_at]
      properties:
        id:
          type: string
          format: uuid
        method:
          $ref: '#/components/schemas/HttpMethod'
        path:
          type: string
          description: Ruta tal como aparece en la versión vigente (o en la última que la incluyó, si fue retirada).
          examples: ['/users/{userId}/orders']
        operation_id:
          type: [string, 'null']
        summary:
          type: [string, 'null']
          description: '`summary` de la operación.'
        tags:
          type: array
          items:
            type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/Parameter'
        body:
          description: Cuerpo de la petición; `null` si no tiene.
          oneOf:
            - $ref: '#/components/schemas/RequestBody'
            - type: 'null'
        security:
          type: array
          description: Esquemas de seguridad declarados; vacío si la operación es pública según el contrato.
          items:
            $ref: '#/components/schemas/DeclaredSecurity'
        retired_at:
          type: [string, 'null']
          format: date-time
          description: Fecha en que dejó de aparecer en el contrato; `null` si está vigente.
    Parameter:
      type: object
      additionalProperties: false
      required: [name, location, required, type]
      properties:
        name:
          type: string
        location:
          type: string
          enum: [path, query, header, cookie]
        required:
          type: boolean
        type:
          type: [string, 'null']
          description: Tipo del esquema (`string`, `integer`…), o `null` si no se declaró.
    RequestBody:
      type: object
      additionalProperties: false
      required: [required, content_types]
      properties:
        required:
          type: boolean
        content_types:
          type: array
          items:
            type: string
          examples: [['application/json']]
    DeclaredSecurity:
      type: object
      additionalProperties: false
      required: [scheme, type]
      properties:
        scheme:
          type: string
          description: Nombre del esquema en `components.securitySchemes`.
        type:
          type: string
          enum: [http_bearer, http_basic, api_key, oauth2, openid_connect, other]
    OperationPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
